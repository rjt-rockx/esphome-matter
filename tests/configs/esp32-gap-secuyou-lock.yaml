# Real device: Secuyou smart lock (VID 5149 / PID 111), Thread.
# Source: HA fixture secuyou_smart_lock.json (evidence=dump).
# Real shape: EP1 door_lock (rev 2) PIN+COTA+USR, LockType 2 (Other). No battery cluster.
#
# Variant (b): explicit endpoint.
#
esphome:
  name: matter-secuyou-lock

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: ../../components

logger:

network:
  enable_ipv6: true

openthread:
  tlv: "0e08000000000001000000030000134a0300001035060004001fffe00208dead00beef00cafe0708fd00000000000001051000112233445566778899aabbccddeeff030f4f70656e5468726561642d65737001021234"

matter:
  endpoints:
    1:
      door_lock:
        lock_id: front_door
        lock_type: OTHER
        with_features: [PIN Credential, CredentialsOverTheAirAccess, User]

output:
  - platform: gpio
    id: lock_relay
    pin: GPIO10

lock:
  - platform: output
    id: front_door
    name: Front door
    output: lock_relay
