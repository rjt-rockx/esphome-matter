    restore_mode: ALWAYS_OFF
  - platform: rgbww
    id: rgbww_light
    name: RGBWW light
    red: out_rgbww_red
    green: out_rgbww_green
    blue: out_rgbww_blue
    cold_white: out_rgbww_cold
    warm_white: out_rgbww_warm
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 3000 K
    color_interlock: false
    restore_mode: ALWAYS_OFF
    effects:
      - lambda:
          name: Color loop
          update_interval: 200ms
          lambda: |-
            static int hue = 0;
            hue = (hue + 10) % 360;
            float r, g, b;
            hsv_to_rgb(hue, 1.0f, 1.0f, r, g, b);
            auto call = id(rgbww_light).turn_on();
            call.set_rgb(r, g, b);
            call.set_white_if_supported(0);
            call.set_cold_white_if_supported(0);
            call.set_warm_white_if_supported(0);
            call.set_transition_length(0);
            call.perform();
  - platform: rgb
    id: rgb_light
    name: RGB light
    red: out_rgb_red
    green: out_rgb_green
    blue: out_rgb_blue
    restore_mode: ALWAYS_OFF
