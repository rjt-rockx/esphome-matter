# Matter actions that run on a schedule
interval:
  - interval: 10min
    then:
      - matter.operational_state.set:
          endpoint: 121
          state: running
          phase: Wash
      - matter.operational_state.error:
          endpoint: 120
          cluster: rvc_operational_state
          error: stuck
          label: Wheels stuck
      - matter.operational_state.completed:
          endpoint: 121
          total_operational_time: 3600
      - matter.mode.set:
          endpoint: 121
          cluster: laundry_washer_mode
          mode: 10
      - matter.set_attribute:
          path: 3.on_off.on_off
          value: false
  - interval: 60s
    then:
      - matter.remove_fabric:
          fabric_index: !lambda "return 2;"
