# Compile-everything image: as many device types, bindings and options as fit in one
# ESP32-C6 firmware (Wi-Fi). It is compiled nightly (.github/workflows/nightly.yml) so that a
# break in any generated code path shows up even when no other test config exercises it.
#
# Not covered, because they exclude each other or need another radio setup: Thread / ICD
# (esp32-thread.yaml, esp32-*-icd.yaml), BLE only commissioning (esp32-ble-commissioning.yaml),
# Ethernet (esp32-ethernet.yaml) and the cooktop device type (its OnOff conformance cannot
# be resolved yet).
esphome:
  name: matter-ci-compile-all
  friendly_name: Compile All
  project:
    name: example.matter-compile-all
    version: "1.0.0"
  on_boot:
    priority: -100
    then:
      - matter.set_attribute:
          path: 3.on_off.on_off
          value: true
      - matter.send_event:
          path: generic_switch_manual.switch.initial_press
          fields:
            new_position: 1
      - matter.send_event:
          path: generic_switch_manual.switch.short_release
          fields:
            previous_position: 1

substitutions:
  esp32_variant: ESP32C6

esp32:
  variant: ${esp32_variant}
  # A firmware with every cluster enabled does not fit the two 1.75 MB app slots of a 4 MB chip.
  flash_size: 16MB
  framework:
    type: esp-idf

external_components:
  - source: ../../components

logger:

api:

# Matter OTA lives next to ESPHome's own OTA (same ota_0/ota_1 partitions).
ota:
  - platform: esphome

network:
  enable_ipv6: true

wifi:
  ssid: ci-test-network
  password: ci-test-password

matter:
  # Node identity and Basic Information
  vendor_name: ESPHome CI
  vendor_id: 0xFFF1
  product_name: Compile All
  product_id: 0x8001
  hardware_version: 2
  hardware_version_string: "rev-c"
  software_version: 3
  software_version_string: "1.0.0-ci"
  node_label: Compile All Node
  serial_number: "SN-COMPILE-ALL"
  unique_id: "compile-all-0001"
  max_fabrics: 8
  discriminator: 3841
  passcode: 20202021
  persist_passcode: true
  debug: true

  on_commissioned:
    - logger.log: Commissioned
  on_decommissioned:
    - logger.log: Decommissioned
  on_identify:
    - then:
        - logger.log:
            format: "identify ep=%u active=%d time=%us effect=%u"
            args: [endpoint_id, active, identify_time, effect]
    - endpoint: 1
      then:
        - if:
            condition:
              lambda: "return active;"
            then:
              - light.turn_on:
                  id: status_light
                  effect: Identify
            else:
              - light.turn_off: status_light

  ota:
    query_interval: 12h
    watchdog_timeout: 300s
    on_state:
      - text_sensor.template.publish:
          id: matter_ota_state
          state: !lambda return state;
    on_download_started:
      - logger.log: Matter OTA download started
    on_download_complete:
      - logger.log: Matter OTA download complete
    on_download_failed:
      - logger.log: Matter OTA download failed
    on_apply_started:
      - logger.log: Matter OTA apply started
    on_apply_failed:
      - logger.log: Matter OTA apply failed

  # Commissioning state on an LED, button for the commissioning window and the factory reset
  status_led:
    output: status_led_out
    commissioned: on
  pairing:
    binary_sensor: pair_button
    open_window_hold: 3s
    factory_reset_hold: 10s
    timeout: 5min

  # The `bridge:` block is lowered into an Aggregator and Bridged Nodes at hashed, stable endpoints
  bridge:
    devices:
      # Several device types: Bridged Node endpoint plus one child endpoint each.
      kitchen_thermometer:
        name: Kitchen Thermometer
        vendor_name: Xiaomi
        product_name: LYWSD03MMC
        reachable: kitchen_seen
        battery: kitchen_battery
        temperature_sensor: kitchen_temp
        humidity_sensor: kitchen_humidity
      # One device type: it shares the endpoint with the Bridged Node.
      relay_a:
        name: Relay A
        endpoint: 300 # pinned
        on_off_plug_in_unit:
          switch_id: bridge_relay_a
      relay_b:
        nested: true
        on_off_plug_in_unit:
          switch_id: bridge_relay_b
      # primary: this device type shares the Bridged Node endpoint, the others get child endpoints.
      heater:
        name: Heater
        primary: on_off_plug_in_unit
        on_off_plug_in_unit:
          switch_id: bridge_relay_c
        temperature_sensor: heater_temp

  endpoints:
    # ---------------------------------------------------------------------------------------------
    # Root node: node level battery with every option. Its EndpointList defaults to all endpoints.
    # ---------------------------------------------------------------------------------------------
    0:
      battery:
        percent: battery_percent
        voltage: battery_voltage
        replacement_needed: battery_replace
        charging: battery_charging
        charged: battery_full
        replaceability: user_replaceable
        replacement_description: CR123A
        quantity: 2
        warning_below: 25
        critical_below: 8
        description: Main battery
        order: 1

    # ---------------------------------------------------------------------------------------------
    # Lights and plugs bound to ESPHome lights and switches
    # ---------------------------------------------------------------------------------------------
    1:
      label: Binary light
      on_off_light:
        light_id: binary_light
    2:
      dimmable_light:
        light_id: dimmable_light
        min_level: 10%
        max_level: 90%
        on_off_transition_time: 2s
    3:
      color_temperature_light:
        light_id: ct_light
    4:
      extended_color_light:
        light_id: rgbww_light
        with_features:
          - Hue And Saturation
          - EnhancedHue
          - ColorLoop
        color_loop_effect: Color loop
    5:
      # An RGB only light has no color temperature range.
      extended_color_light:
        light_id: rgb_light
    6:
      dimmable_plug_in_unit:
        light_id: plug_dimmer
        min_level: 5%
        on_off_transition_time: 500ms
    7:
      mounted_dimmable_load_control:
        light_id: mounted_dimmer
    8:
      on_off_plug_in_unit:
        light_id: plug_relay_light
    9:
      mounted_on_off_control:
        light_id: mounted_light
        on_off_transition_time: 1s
      clusters:
        level_control:
          with_features:
            - OnOff
            - Lighting
    10:
      on_off_plug_in_unit:
        switch_id: plug_switch
    11:
      on_off_light:
        switch_id: lamp_switch
    12:
      mounted_on_off_control:
        switch_id: mounted_switch

    # ---------------------------------------------------------------------------------------------
    # Controller switches (bindings) and the Binding cluster
    # ---------------------------------------------------------------------------------------------
    20:
      id: onoff_switch_endpoint
      on_off_light_switch:
    21:
      id: dimmer_endpoint
      dimmer_switch:
    22:
      id: color_dimmer_endpoint
      color_dimmer_switch:
    # A light with the Binding cluster added by hand.
    13:
      on_off_light:
        light_id: binding_light
      clusters:
        binding:

    # ---------------------------------------------------------------------------------------------
    # Generic switch and doorbells
    # ---------------------------------------------------------------------------------------------
    23:
      generic_switch:
        binary_sensor_id: switch_button
        long_press_time: 600ms
        multi_press_window: 350ms
        multi_press_max: 3
    24:
      id: generic_switch_manual
      generic_switch:
        with_features: [MomentarySwitchRelease, MomentarySwitchLongPress]
    25:
      generic_switch:
        binary_sensor_id: toggle
        with_features: [LatchingSwitch]
    26:
      generic_switch:
        binary_sensor_id: action_button
        with_features: [ActionSwitch, MomentarySwitchLongPress]
        multi_press_max: 4
    27:
      generic_switch:
        event_id: remote_event
        multi_press_max: 3
    28:
      generic_switch:
        event_id: held_event
        event_map:
          tap: 1
          tap_twice: 2
          hold: long_press
          release: press_end
    29:
      doorbell:
        event_id: bell_event
        with_features: [MomentarySwitchRelease]
    30:
      doorbell:
        binary_sensor_id: bell_button
    31:
      audio_doorbell:
        with_features: [Audio]

    # ---------------------------------------------------------------------------------------------
    # Sensors
    # ---------------------------------------------------------------------------------------------
    40:
      temperature_sensor: temperature
    41:
      pressure_sensor: pressure_kpa
    42:
      humidity_sensor: humidity
    43:
      light_sensor:
        illuminance: illuminance
      battery:
        percent: battery_level
        order: 2
    44:
      flow_sensor:
        flow: flow_rate
    45:
      power_source:
        battery: battery_level_2
    46:
      air_quality_sensor:
        temperature: temperature
        relative_humidity: humidity
        carbon_dioxide: co2
        total_voc: tvoc_ppb
        formaldehyde: ch2o
        pm_1: pm_1_0
        pm_2_5: pm_2_5
        pm_10: pm_10_0
        radon: radon
        measurement_units:
          formaldehyde: ppb
    47:
      air_quality_sensor:
        air_quality: air_quality_index
        carbon_dioxide: co2
    48:
      air_quality_sensor:
        air_quality:
          sensor: pm_2_5
        pm_2_5: pm_2_5
    49:
      air_quality_sensor:
        air_quality:
          sensor: tvoc_ppb
          thresholds:
            fair: 220
            moderate: 660
            poor: 2200
    50:
      electrical_sensor:
        voltage: mains_voltage
        active_current: mains_current
        active_power: mains_power
        apparent_power: mains_apparent_power
        frequency: mains_frequency
        power_factor: mains_power_factor
        energy_imported: mains_energy
        energy_exported: mains_energy_exported
    51:
      electrical_sensor:
        current_type: dc
        voltage: dc_voltage
        active_current: dc_current
        active_power: dc_power
    52:
      soil_sensor:
        temperature: temperature
        soil_moisture: soil_moisture
    # A sensor with its own wired power source that only powers itself.
    53:
      temperature_sensor: temperature
      wired:
        current_type: ac
        present: mains_present
        voltage: wired_voltage
        frequency: wired_frequency
        current: wired_current
        powers: [53]
        order: 6
    # Battery thresholds from a percent sensor, and as binary sensors
    54:
      humidity_sensor: humidity
      battery:
        percent: battery_percent_2
        order: 4
    55:
      contact_sensor:
        boolean_state: door
      battery:
        low: battery_low
        critical: battery_critical
        description: Door battery
        order: 5

    # ---------------------------------------------------------------------------------------------
    # Binary sensors: contact, occupancy, leak, freeze, rain, smoke / CO
    # ---------------------------------------------------------------------------------------------
    60:
      contact_sensor:
        boolean_state: front_door
        alarms:
          visual: true
    61:
      contact_sensor: window
    62:
      contact_sensor:
        boolean_state: reed_switch
        inverted: true
    63:
      contact_sensor:
        boolean_state: closed_switch
        inverted: false
    64:
      occupancy_sensor:
        occupancy: hallway_motion
        hold_time:
          default: 45s
          min: 5s
          max: 10min
          number: hallway_hold_time
    65:
      occupancy_sensor:
        occupancy: office_presence
        hold_time: 20s
    66:
      occupancy_sensor:
        occupancy: desk_pressure_mat
        with_features: [PhysicalContact]
    67:
      water_leak_detector:
        boolean_state: basement_leak
        alarms:
          visual: true
          audible: true
          suppress: true
          on_active:
            - logger.log:
                format: "Leak alarm: visual=%d audible=%d"
                args: [visual, audible]
          on_suppressed:
            - logger.log:
                format: "Leak alarm suppressed: visual=%d audible=%d"
                args: [visual, audible]
        sensitivity:
          levels: 3
          default: 1
          number: leak_sensitivity
    68:
      water_freeze_detector: pipe_cold
    69:
      rain_sensor:
        boolean_state: roof_rain
        sensitivity:
          levels: 5
    70:
      smoke_co_alarm:
        smoke_state: kitchen_smoke
        co_state: kitchen_co
        hardware_fault: alarm_fault
        end_of_service: alarm_expired
        device_muted: alarm_muted
        self_test_duration: 8s
        on_self_test:
          - logger.log: Smoke alarm self test requested
    71:
      smoke_co_alarm:
        smoke_state: hall_smoke
        test_in_progress: hall_testing
        on_self_test:
          - binary_sensor.template.publish:
              id: hall_testing
              state: true
          - delay: 3s
          - binary_sensor.template.publish:
              id: hall_testing
              state: false

    # ---------------------------------------------------------------------------------------------
    # Covers, closures and locks / valves
    # ---------------------------------------------------------------------------------------------
    80:
      window_covering:
        cover_id: living_room_shade
    81:
      window_covering:
        cover_id: bedroom_blind
        end_product_type: exterior_venetian_blind
    82:
      window_covering:
        cover_id: open_close_awning
    83:
      label: Garage door
      closure:
        cover_id: garage_door
    # Compatibility mode: advertised as Window Covering, what most controllers use today.
    84:
      window_covering:
        cover_id: side_gate
        closure_compat: true
    85:
      window_covering:
        cover_id: garage_compat
        closure_compat: true
        end_product_type: roller_shutter
    86:
      closure_panel:
        with_features: [Positioning, Translation]
    87:
      closure_controller: {}
    88:
      door_lock:
        lock_id: front_lock
        lock_type: DEAD_BOLT
        with_features:
          - DoorPositionSensor
          - Unbolt
          - WeekDayAccessSchedules
          - CredentialsOverTheAirAccess
    89:
      water_valve:
        valve_id: garden_valve
        with_features:
          - Level
    90:
      water_valve:
        valve_id: simple_valve

    # ---------------------------------------------------------------------------------------------
    # Fans, filters, climate
    # ---------------------------------------------------------------------------------------------
    100:
      fan:
        fan_id: ceiling_fan
    101:
      # A fan with only on/off support
      fan:
        fan_id: relay_fan
    102:
      # Auto has no ESPHome equivalent, so it can't be combined with fan_id.
      fan:
        with_features:
          - Auto
    # Air purifier: fan with Wind (preset modes) and Step, HEPA + carbon filters.
    103:
      air_purifier:
        fan_id: purifier_fan
        wind_presets:
          natural: Breeze
          sleep: Sleep
        with_features: [step]
      clusters:
        hepa_filter_monitoring:
          condition: hepa_life
          warning_level: 25%
          critical_level: 10%
          replace_needed: hepa_replace
          reset_button: hepa_reset_button
          on_reset:
            - logger.log: HEPA filter replaced
        activated_carbon_filter_monitoring:
          replace_needed: carbon_replace
          on_reset:
            - logger.log: Carbon filter replaced
    104:
      extractor_hood:
        fan_id: hood_fan
        with_features: [step]
    # Room air conditioner: Fan Control bound to the climate fan modes and swing.
    105:
      room_air_conditioner:
        climate_id: ac
      clusters:
        fan_control:
          climate_id: ac
    106:
      room_air_conditioner:
        climate_id: ac2
        fan_id: indoor_fan
    # Heat pump with its thermostat on a child endpoint (the conforming layout).
    107:
      heat_pump: {}
    108:
      parent: 107
      tags:
        - {namespace: common_number, tag: one}
      thermostat:
        climate_id: boiler
    109:
      tags:
        - {namespace: common_number, tag: two}
      thermostat:
        climate_id: hall_thermostat
      clusters:
        fan_control:
          fan_id: stat_fan
    110:
      tags:
        - {namespace: common_number, tag: three}
      thermostat:
        with_features: [Heating, Cooling, AutoMode]
      clusters:
        thermostat_user_interface_configuration:
    111:
      thermostat_controller: {}

    # ---------------------------------------------------------------------------------------------
    # Delegate clusters: Mode Base derived clusters, Operational State, Mode Select
    # ---------------------------------------------------------------------------------------------
    120:
      robotic_vacuum_cleaner: {}
      clusters:
        rvc_run_mode:
          modes:
            - {label: Idle, mode: 0, tags: [idle]}
            - {label: Cleaning, mode: 1, tags: [cleaning]}
            - {label: Mapping, mode: 2, tags: [mapping]}
          select: vacuum_run_mode
          decide_in_automation: true
          on_change_to_mode:
            - if:
                condition:
                  lambda: 'return mode == 1 && id(vacuum_bin_full).state;'
                then:
                  - matter.mode.reject:
                      status: dust_bin_full
                      text: Empty the dust bin first
        rvc_clean_mode:
          modes:
            - {label: Vacuum, tags: [vacuum]}
            - {label: Mop, tags: [mop, quiet]}
            - {label: Vacuum then mop, mode: 5, tags: [vacuum_then_mop]}
          on_change_to_mode:
            - logger.log:
                format: "clean mode %d"
                args: [mode]
        rvc_operational_state:
          phases: [Cleaning, Returning]
          state: vacuum_state
          decide_in_automation: true
          decide_timeout: 300ms
          phase: vacuum_phase
          countdown_time: vacuum_eta
          on_pause:
            - logger.log: pause requested
          on_resume:
            - logger.log: resume requested
          on_go_home:
            - matter.operational_state.reject:
                error: command_invalid_in_state
    121:
      laundry_washer: {}
      clusters:
        laundry_washer_mode:
          modes:
            - {label: Normal, tags: [normal]}
            - {label: Delicate, tags: [delicate, quiet]}
            - {label: Heavy, mode: 10, tags: [heavy, max]}
          select: washer_program
          accept: when_idle
        laundry_washer_controls:
          spin_speeds: ["Off", "400", "800", "1200"]
          spin_speed: washer_spin
          rinses: [none, normal, extra]
          number_of_rinses: washer_rinses
        operational_state:
          phases: [Pre-wash, Wash, Rinse, Spin]
          states:
            - {id: 0x80, label: Soaking}
          state: washer_state
          idle_states: [stopped, paused]
          allowed_states:
            start: [stopped]
            stop: [running, paused]
          state_map:
            Idle: stopped
            Washing: running
          countdown_time: washer_remaining
          on_start:
            - switch.turn_on: washer_start
          on_stop:
            - switch.turn_off: washer_start
          on_pause:
            - logger.log: pause
          on_resume:
            - logger.log: resume
    122:
      mode_select: {}
      clusters:
        mode_select:
          description: Fan speed preset
          modes:
            - {label: Low, tags: [{mfg_code: 0xFFF1, value: 1}]}
            - {label: High}
          select: fan_preset
          on_change_to_mode:
            - logger.log:
                format: "preset %d"
                args: [mode]
    123:
      water_heater:
        with_features: [heating]
      clusters:
        water_heater_mode:
          modes:
            - {label: "Off", tags: [off]}
            - {label: Manual, tags: [manual]}
            - {label: Timed, tags: [timed, vacation]}
    124:
      dishwasher: {}
      clusters:
        dishwasher_mode:
          modes:
            - {label: Normal, tags: [normal]}
            - {label: Heavy, tags: [heavy]}
            - {label: Light, tags: [light, quick]}
        operational_state:
          state: dishwasher_state
    125:
      refrigerator:
        door_open: fridge_door
      clusters:
        refrigerator_and_temperature_controlled_cabinet_mode:
          modes:
            - label: Normal
              tags: [auto]
            - label: Rapid cool
              tags: [rapid_cool]
            - label: Vacation
              tags: [vacation, low_energy]
              option: Away
          select: fridge_mode
    126:
      temperature_controlled_cabinet:
        with_features: [TemperatureNumber]
    127:
      laundry_dryer: {}
    128:
      oven: {}
    129:
      cook_surface: {}
    130:
      microwave_oven:
        with_features: [PowerAsNumber]

    # ---------------------------------------------------------------------------------------------
    # Electrical Sensor topologies
    # ---------------------------------------------------------------------------------------------
    140:
      electrical_sensor:
        topology: node
        voltage: topo_voltage
        active_power: topo_total_power
        energy_imported: topo_total_energy
    # A power strip: the total on endpoint 141 measures its two outlets below it.
    141:
      electrical_sensor:
        topology: tree
        active_power: strip_power
    142:
      parent: 141
      on_off_plug_in_unit:
        switch_id: outlet_1
      electrical_sensor:
        topology: tree
        active_power: outlet_1_power
        energy_exported: outlet_1_energy
    143:
      parent: 141
      on_off_plug_in_unit:
        switch_id: outlet_2
      electrical_sensor:
        topology: tree
        active_power: outlet_2_power
    144:
      window_covering:
        cover_id: shade
      electrical_sensor:
        topology: tree
        active_power: motor_power
    145:
      electrical_sensor:
        topology: set
        available_endpoints: [142, 143]
        active_endpoints: [142]
        active_power: set_power

    # ---------------------------------------------------------------------------------------------
    # Hand-written bridge: one Aggregator, Bridged Nodes below it get their parent automatically.
    # ---------------------------------------------------------------------------------------------
    150:
      aggregator: {}
    151:
      parent: 150
      bridged_node: Relay 1 # shorthand for {name: Relay 1}
      on_off_plug_in_unit:
        switch_id: relay1
    152:
      parent: 150
      bridged_node:
        name: Relay 2
        unique_id: relay-two
        vendor_name: ACME
        product_name: Relay board
        serial_number: R2-0001
      on_off_light:
        switch_id: relay2
    # Composed bridged device: the Bridged Node endpoint and one child endpoint per sensor.
    153:
      parent: 150
      bridged_node:
        name: Garage Sensor
        reachable: garage_online
        vendor_name: Xiaomi
        product_name: LYWSD03MMC
        hardware_version: 1
        software_version: 2
        software_version_string: "1.0.0_0130"
        manufacturing_date: "20250131"
        product_url: https://example.com/sensor
      battery:
        percent: garage_battery
        powers: [153, 154, 155]
    154:
      parent: 153
      temperature_sensor: garage_temp
    155:
      parent: 153
      humidity_sensor: garage_humidity

    # ---------------------------------------------------------------------------------------------
    # Device types that need no entity: created bare so that other Matter devices can address them
    # ---------------------------------------------------------------------------------------------
    160:
      camera:
        with_features: [Video]
    161:
      chime: {}
    162:
      video_doorbell: {}
    163:
      pump:
        with_features: [ConstantSpeed]
    164:
      pump_controller: {}
    165:
      evse: {}
    166:
      device_energy_management:
        with_features: [PowerAdjustment, PowerForecastReporting]
    167:
      electrical_utility_meter: {}
    168:
      electrical_energy_tariff: {}
    169:
      electrical_meter:
        with_features: [AlternatingCurrent, ImportedEnergy, CumulativeEnergy]
    170:
      control_bridge: {}
    171:
      solar_power: {}
    172:
      battery_storage: {}
    173:
      thread_border_router: {}
    174:
      ota_provider: {}
    175:
      ota_requestor: {}
    176:
      on_off_plug_in_unit: {}
    177:
      dimmable_plug_in_unit: {}

# -------------------------------------------------------------------------------------------------
# Entities
# -------------------------------------------------------------------------------------------------
output:
  - platform: template
    id: status_led_out
    type: binary
    write_action:
      - lambda: (void) state;
  - platform: template
    id: out_binary
    type: binary
    write_action:
      - lambda: (void) state;
  - platform: template
    id: out_binding_light
    type: binary
    write_action:
      - lambda: (void) state;
  - platform: template
    id: out_plug_relay
    type: binary
    write_action:
      - lambda: (void) state;
  - platform: template
    id: out_lock
    type: binary
    write_action:
      - lambda: (void) state;
  - platform: template
    id: motor_open
    type: binary
    write_action:
      - logger.log: motor open
  - platform: template
    id: motor_close
    type: binary
    write_action:
      - logger.log: motor close
  - platform: template
    id: relay_pulse
    type: binary
    write_action:
      - logger.log: relay pulse
  - platform: template
    id: out_dimmable
    type: float
    write_action:
      - lambda: (void) state;
  - platform: template
    id: out_plug_dimmer
