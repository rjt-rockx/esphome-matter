binary_sensor:
  # Controller buttons sending commands to bound devices
  - id: button_up
    platform: gpio
    pin:
      number: GPIO0
      mode:
        pullup: true
        input: true
      inverted: true
    on_click:
      matter.send_command: dimmer_endpoint.on_off.on
    on_press:
      matter.send_command:
        path: dimmer_endpoint.level_control.move_with_on_off
        arguments:
          move_mode: 0
          rate: 50
    on_release:
      matter.send_command: dimmer_endpoint.level_control.stop_with_on_off
  - id: button_down
    platform: gpio
    pin:
      number: GPIO1
      mode:
        pullup: true
        input: true
      inverted: true
    on_click:
      matter.send_command: dimmer_endpoint.on_off.off
    on_press:
      matter.send_command:
        path: dimmer_endpoint.level_control.move_with_on_off
        arguments:
          move_mode: 1
          rate: 50
    on_release:
      matter.send_command: dimmer_endpoint.level_control.stop_with_on_off
  - id: toggle_button
    platform: gpio
    pin: GPIO10
    on_click:
      matter.send_command: onoff_switch_endpoint.on_off.toggle
    on_double_click:
      matter.send_command:
        endpoint: color_dimmer_endpoint
        cluster: color_control
        command: move_to_color_temperature
        arguments:
          color_temperature_mireds: 370
          transition_time: 1s
  # Generic switch sources
  - id: switch_button
    platform: gpio
    pin:
      number: GPIO2
      mode:
        pullup: true
        input: true
      inverted: true
  - id: toggle
    platform: gpio
    pin:
      number: GPIO3
      mode:
        pullup: true
        input: true
      inverted: true
  - id: action_button
    platform: gpio
    pin: GPIO19
  - id: bell_button
    platform: gpio
    pin: GPIO18
  - id: manual_button
    platform: gpio
    pin:
      number: GPIO6
      mode:
        pullup: true
        input: true
      inverted: true
    on_press:
      - matter.send_switch_event:
          endpoint: generic_switch_manual
          event: initial_press
    on_release:
      - matter.send_switch_event:
          endpoint: generic_switch_manual
          event: short_release
    on_multi_click:
      - timing:
          - ON for at least 1s
        then:
          - matter.send_switch_event:
              endpoint: 24
              event: long_press
              position: 1
  # Commissioning
  - platform: gpio
    id: pair_button
    pin:
      number: GPIO7
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 30ms
    on_double_click:
      matter.open_commissioning_window:
        timeout: 5min
    on_multi_click:
      - timing:
          - ON for at least 15s
        then:
          - matter.reset_identity:
          - matter.factory_reset:
  # Matter inputs
