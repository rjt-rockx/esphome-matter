esphome:
  name: matter-ci-switch

substitutions:
  esp32_variant: ESP32C6

esp32:
  variant: ${esp32_variant}
  framework:
    type: esp-idf

external_components:
  - source: ../../components

logger:

api:

network:
  enable_ipv6: true

wifi:
  ssid: ci-test-network
  password: ci-test-password

matter:
  endpoints:
    1:
      on_off_plug_in_unit:
        switch_id: relay
    2:
      on_off_light:
        switch_id: lamp_relay
    3:
      mounted_on_off_control:
        switch_id: load_relay

switch:
  - platform: template
    id: relay
    name: Relay
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: lamp_relay
    name: Lamp Relay
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: load_relay
    name: Load Relay
    optimistic: true
    restore_mode: ALWAYS_OFF
