esphome:
  name: matter-ci-expose-all

substitutions:
  esp32_variant: ESP32C6

esp32:
  variant: ${esp32_variant}
  framework:
    type: esp-idf

external_components:
  - source: ../../components

logger:

api:

network:
  enable_ipv6: true

wifi:
  ssid: ci-test-network
  password: ci-test-password

matter:
  expose: all
  exclude: [skip_me]

switch:
  - platform: template
    id: relay
    name: Relay
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: skip_me
    name: Excluded relay
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: hidden_relay
    name: Hidden relay
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: nameless_relay
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: cfg_relay
    name: Config relay
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template # no id: cannot be referenced from endpoints
    name: Anonymous relay
    optimistic: true
    restore_mode: ALWAYS_OFF

output:
  - platform: template
    id: out
    type: float
    write_action: []

light:
  - platform: monochromatic
    id: lamp
    name: Lamp
    output: out
    restore_mode: ALWAYS_OFF

button:
  - platform: template
    id: some_button
    name: Button

sensor:
  - platform: template
    id: room_temp
    name: Room Temperature
    unit_of_measurement: "°C"
    device_class: temperature
    lambda: return 21.5;
  - platform: template
    id: diag_temp
    name: Diagnostic temperature
    entity_category: diagnostic
    unit_of_measurement: "°C"
    device_class: temperature
    lambda: return 30.0;
  - platform: internal_temperature # platform default: diagnostic
    id: chip_temp
    name: Chip temperature
  - platform: template
    id: nameless_sensor
    unit_of_measurement: "°C"
    device_class: temperature
    lambda: return 1.0;
