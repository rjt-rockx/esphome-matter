esphome:
  name: matter-ci-expose-infer

substitutions:
  esp32_variant: ESP32C6

esp32:
  variant: ${esp32_variant}
  framework:
    type: esp-idf

external_components:
  - source: ../../components

logger:

api:

network:
  enable_ipv6: true

wifi:
  ssid: ci-test-network
  password: ci-test-password

# Every entity below is exposed without `as:`: the device types come from the platform, the
# device_class and the unit. Hashed endpoint numbers, tags numbered in id order.
matter:
  expose:
    - relay_*
    - {id: relay_1_power, meters: relay_1}   # a meter on its switch's endpoint
    - {id: relay_2_power}                    # name prefix: lands on relay_2
    - {id: lock_door}
    - {id: blind}
    - {id: fan_1}
    - {id: heater}
    - {id: room_ac, as: room_air_conditioner}
    - {id: valve_1}
    - {id: door_contact}
    - {id: hall_motion}
    - {id: leak}
    - {id: smoke_alarm}
    - {id: co_alarm}
    - {id: pressure}
    - {id: lux}
    - {id: flow}
    - {id: co2}
    - {id: pm25}
    - {id: voc}
    - {id: batt}                             # several endpoints: its own Power Source endpoint
    - {id: wall_button, as: generic_switch, tags: [{namespace: common_position, tag: left}]}
    - {id: wall_button_2, as: generic_switch, tags: [{namespace: common_position, tag: right}]}
    - {id: knob_event}
    - {id: child_temp, parent: heater}
    - {id: heater_hum, attach_to: heater}
    - {id: fan_1_extra, as: fan, clusters: {identify: {}}}
  exclude: [wall_button_3]

switch:
  - platform: template
    id: relay_1
    name: Relay 1
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: relay_2
    name: Relay 2
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: relay_10
    name: Relay 10
    optimistic: true
    restore_mode: ALWAYS_OFF

lock:
  - platform: template
    id: lock_door
    name: Door lock
    optimistic: true

cover:
  - platform: template
    id: blind
    name: Blind
    device_class: blind
    optimistic: true

fan:
  - platform: template
    id: fan_1
    name: Fan
    speed_count: 3
  - platform: template
    id: fan_1_extra
    name: Fan Extra
    speed_count: 3

valve:
  - platform: template
    id: valve_1
    name: Valve
    optimistic: true

climate:
  - platform: thermostat
    id: heater
    name: Heater
    sensor: child_temp
    min_idle_time: 10s
    min_heating_off_time: 10s
    min_heating_run_time: 10s
    heat_action:
      - logger.log: heat
    idle_action:
      - logger.log: idle
  - platform: thermostat
    id: room_ac
    name: Room AC
    sensor: child_temp
    min_idle_time: 10s
    min_cooling_off_time: 10s
    min_cooling_run_time: 10s
    cool_action:
      - logger.log: cool
    idle_action:
      - logger.log: idle

binary_sensor:
  - platform: template
    id: door_contact
    name: Door
    device_class: door
  - platform: template
    id: hall_motion
    name: Hall motion
    device_class: motion
  - platform: template
    id: leak
    name: Leak
    device_class: moisture
  - platform: template
    id: smoke_alarm
    name: Smoke
    device_class: smoke
  - platform: template
    id: co_alarm
    name: CO
    device_class: carbon_monoxide
  - platform: template
    id: wall_button
    name: Button left
  - platform: template
    id: wall_button_2
    name: Button right
  - platform: template
    id: wall_button_3
    name: Button excluded

event:
  - platform: template
    id: knob_event
    name: Knob
    event_types: [press]

sensor:
  - platform: template
    id: relay_1_power
    name: Relay 1 power
    unit_of_measurement: W
    device_class: power
  - platform: template
    id: relay_2_power
    name: Relay 2 power
    unit_of_measurement: W
    device_class: power
  - platform: template
    id: child_temp
    name: Child temperature
    unit_of_measurement: "°C"
    device_class: temperature
  - platform: template
    id: heater_hum
    name: Heater humidity
    unit_of_measurement: "%"
    device_class: humidity
  - platform: template
    id: pressure
    name: Pressure
    unit_of_measurement: hPa
    device_class: pressure
  - platform: template
    id: lux
    name: Lux
    unit_of_measurement: lx
    device_class: illuminance
  - platform: template
    id: flow
    name: Flow
    unit_of_measurement: L/min
    device_class: volume_flow_rate
  - platform: template
    id: co2
    name: CO2
    unit_of_measurement: ppm
    device_class: carbon_dioxide
  - platform: template
    id: pm25
    name: PM2.5
    unit_of_measurement: µg/m³
    device_class: pm25
  - platform: template
    id: voc
    name: VOC
    unit_of_measurement: µg/m³
    device_class: volatile_organic_compounds
  - platform: template
    id: batt
    name: Battery
    unit_of_measurement: "%"
    device_class: battery
