esphome:
  name: matter-ci-multi-relay

substitutions:
  esp32_variant: ESP32C6

esp32:
  variant: ${esp32_variant}
  framework:
    type: esp-idf

external_components:
  - source: ../../components

logger:

api:

network:
  enable_ipv6: true

wifi:
  ssid: ci-test-network
  password: ci-test-password

# Four relays that share a device type. Descriptor Number tags are generated
# automatically (Duplicate condition); labels are optional.
matter:
  endpoints:
    1:
      label: Relay 1
      on_off_plug_in_unit:
        switch_id: relay_1
    2:
      label: Relay 2
      on_off_plug_in_unit:
        switch_id: relay_2
    3:
      on_off_plug_in_unit:
        switch_id: relay_3
    4:
      label: Relay 4
      on_off_plug_in_unit:
        switch_id: relay_4
    # A sibling pair with explicit tags; the tags are used as written.
    10:
      tags:
        - namespace: common_position
          tag: left
      generic_switch:
    11:
      tags:
        - namespace: common_position
          tag: right
      generic_switch:
    # A lone endpoint of its own type needs no TagList.
    20:
      on_off_light:
        switch_id: lamp_relay
    # Child endpoint: PartsList of endpoint 30 lists 31 and 32.
    30:
      on_off_plug_in_unit:
        switch_id: strip_relay
    31:
      parent: 30
      temperature_sensor:
        temperature: strip_temp
    32:
      parent: 30
      temperature_sensor:
        temperature: strip_temp_2

switch:
  - platform: template
    id: relay_1
    name: Relay 1
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: relay_2
    name: Relay 2
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: relay_3
    name: Relay 3
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: relay_4
    name: Relay 4
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: lamp_relay
    name: Lamp Relay
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: strip_relay
    name: Strip Relay
    optimistic: true
    restore_mode: ALWAYS_OFF

sensor:
  - platform: template
    id: strip_temp
    name: Strip Temperature
    unit_of_measurement: "°C"
    device_class: temperature
  - platform: template
    id: strip_temp_2
    name: Strip Temperature 2
    unit_of_measurement: "°C"
    device_class: temperature
