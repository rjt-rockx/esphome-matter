esphome:
  name: matter-ci-ota

substitutions:
  esp32_variant: ESP32C6

esp32:
  variant: ${esp32_variant}
  framework:
    type: esp-idf

external_components:
  - source: ../../components

logger:

api:

# ESPHome's own OTA stays available next to Matter OTA (same ota_0/ota_1).
ota:
  - platform: esphome

network:
  enable_ipv6: true

wifi:
  ssid: ci-test-network
  password: ci-test-password

text_sensor:
  - platform: template
    id: matter_ota_state
    name: Matter OTA state

matter:
  software_version: 2
  ota:
    query_interval: 12h
    watchdog_timeout: 300s
    on_state:
      - text_sensor.template.publish:
          id: matter_ota_state
          state: !lambda return state;
    on_download_started:
      - logger.log: Matter OTA download started
    on_apply_failed:
      - logger.log: Matter OTA apply failed
  endpoints:
    1:
      temperature_sensor:
        temperature: internal_temp

sensor:
  - platform: internal_temperature
    id: internal_temp
