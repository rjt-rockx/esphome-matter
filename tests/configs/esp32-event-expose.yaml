esphome:
  name: matter-ci-event-expose

substitutions:
  esp32_variant: ESP32C6

esp32:
  variant: ${esp32_variant}
  framework:
    type: esp-idf

external_components:
  - source: ../../components

logger:

api:

network:
  enable_ipv6: true

wifi:
  ssid: ci-test-network
  password: ci-test-password

# `event` entities become Generic Switches bound to their events. device_class: doorbell makes the
# Doorbell device type. `as: doorbell` turns a binary sensor into one.
matter:
  expose:
    - remote_event
    - bell_event
    - {id: wired_bell, as: doorbell}
    - {id: held_event, features: [MomentarySwitchRelease, MomentarySwitchLongPress]}

event:
  - platform: template
    id: remote_event
    name: Remote
    device_class: button
    event_types: [single, double, hold]
  - platform: template
    id: held_event
    name: Held
    event_types: [single, hold]
  - platform: template
    id: bell_event
    name: Doorbell
    device_class: doorbell
    event_types: [ring]

binary_sensor:
  - platform: gpio
    id: wired_bell
    name: Wired bell
    pin: GPIO4
