# Blink the status LED while a controller is asking the device to identify
# itself (for example the "Identify" button in Home Assistant, or during
# pairing in Apple Home). See docs/device-info.md.
esphome:
  name: matter-identify
  friendly_name: Identify Demo
  project:
    name: example.matter-identify
    version: "1.0.0"

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter
    components: [matter]

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  node_label: Identify Demo
  serial_number: "DEMO-0001"
  on_identify:
    - then:
        - if:
            condition:
              lambda: "return active;"
            then:
              - light.turn_on:
                  id: status_led
                  effect: Identify
            else:
              - light.turn_off: status_led
  endpoints:
    1:
      on_off_plug_in_unit:
        switch_id: relay

switch:
  - platform: gpio
    id: relay
    name: Relay
    pin: GPIO4
    restore_mode: ALWAYS_OFF

output:
  - platform: gpio
    id: led_out
    pin: GPIO8

light:
  - platform: binary
    id: status_led
    name: Status LED
    output: led_out
    internal: true
    effects:
      - strobe:
          name: Identify
          colors:
            - state: true
              duration: 250ms
            - state: false
              duration: 250ms
