# mirrors: switchbot-lock-vision-pid07ff
# Real device: SwitchBot Lock Vision (VID 5015 / PID 0x07FF) and SwitchBot Lock Pro. Evidence: DCL (device type 10) +
# consumer-products row (DoorLock + BasicInformation only, no dump).
# Mirrors: the smallest possible lock: one entity, one line of expose. PIN is not required, so remote unlock from
# Google Home is disabled (see docs/lock-valve.md).
esphome:
  name: matter-switchbot-lock

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

api:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  expose:
    - {id: front_door, as: door_lock}

output:
  - platform: gpio
    id: lock_relay
    pin: GPIO10

lock:
  - platform: output
    id: front_door
    name: Front door
    output: lock_relay
