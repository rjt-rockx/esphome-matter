# mirrors: tuya-curtain-motor
# Real device: Tuya WiFi curtain motor (ESPHome `tuya` cover, the esphome-hardware catalog row
# `tuya-curtain-motor`, evidence=doc). Matter shape of the catalog row: one window_covering endpoint with LF+PA_LF.
# Mirrors: tuya MCU cover with a position datapoint. Curtains are `device_class: curtain` (Drapery / CentralCurtain).
#
# Variant (a): expose shorthand with `as: window_covering`.
esphome:
  name: matter-tuya-curtain-x

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

api:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  expose:
    - {id: curtain, as: window_covering}

uart:
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

tuya:

cover:
  - platform: tuya
    id: curtain
    name: Curtain
    device_class: curtain
    position_datapoint: 2
    control_datapoint: 1
    invert_position: true
