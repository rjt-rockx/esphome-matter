# mirrors: zemismart-mt25b
# Real device: Zemismart MT25B roller blind motor (VID 5020 / PID 65376), Thread, battery powered.
# Source: HA fixture zemismart_mt25b.json (evidence=dump).
# Real shape: EP1 window_covering (rev 2) with WindowCovering LF+PA_LF+ABS (Type 0) AND, on the SAME endpoint,
# PowerSource (BAT+RECHG, Order=Rechargeable Battery) and FixedLabel/UserLabel (room/orientation/floor/direction).
# Mirrors: ESPHome `tuya` cover + `tuya` battery sensor, the common Tuya blind motor firmware.
#
# Variant (c): battery on its own Power Source endpoint (docs/sensors.md option 2). Spec-wise this is the cleaner
# node-level shape, but Home Assistant and controllers do not associate it with the blind.
esphome:
  name: matter-zemismart-blind-ps

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

openthread:
  tlv: !secret thread_tlv

matter:
  endpoints:
    1:
      window_covering:
        cover_id: blind
    2:
      power_source:
        battery: blind_battery

uart:
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

tuya:

cover:
  - platform: tuya
    id: blind
    name: Blind
    device_class: blind
    position_datapoint: 2
    control_datapoint: 1
    invert_position: true   # Tuya reports 100 = closed

sensor:
  # Battery level reported by the MCU as datapoint 13 (0..100 %).
  - platform: tuya
    id: blind_battery
    name: Blind battery
    sensor_datapoint: 13
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
