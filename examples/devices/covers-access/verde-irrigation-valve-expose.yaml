# mirrors: verde-irrigation-valve-controller
# Real device: BeaverDam sprinkler controller (ESPHome valve project) and the Verde 7-zone irrigation controller (Apple
# Developer Forums thread 844622): N sibling Water Valve endpoints on one node, plus an optional Flow Sensor.
# Evidence: doc (esphome-hardware `beaverdam-sprinkler-valve`, ecosystem-rendering `verde-irrigation-valve-controller`).
# Real shape (Verde): 7 endpoints 1..7, each water_valve with ValveConfigurationAndControl. They are Duplicates and need a
# TagList.
#
# Variant (a): expose with a glob. All zones get hashed endpoint numbers (not 1..N) and Common Number tags by hash order.
#
# Reduced twin: the credential/schedule/TimeSync features of the real device are left out because they cannot be enabled today (see the twin in _gaps/).
esphome:
  name: matter-sprinkler-x

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

api:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  expose:
    - {id: "zone_*", as: water_valve, }

output:
  - {platform: gpio, id: z1_out, pin: GPIO10}
  - {platform: gpio, id: z2_out, pin: GPIO11}
  - {platform: gpio, id: z3_out, pin: GPIO12}
  - {platform: gpio, id: z4_out, pin: GPIO13}

valve:
  - platform: template
    id: zone_1
    name: Zone 1
    optimistic: true
    open_action: [{output.turn_on: z1_out}]
    close_action: [{output.turn_off: z1_out}]
  - platform: template
    id: zone_2
    name: Zone 2
    optimistic: true
    open_action: [{output.turn_on: z2_out}]
    close_action: [{output.turn_off: z2_out}]
  - platform: template
    id: zone_3
    name: Zone 3
    optimistic: true
    open_action: [{output.turn_on: z3_out}]
    close_action: [{output.turn_off: z3_out}]
  - platform: template
    id: zone_4
    name: Zone 4
    optimistic: true
    open_action: [{output.turn_on: z4_out}]
    close_action: [{output.turn_off: z4_out}]
