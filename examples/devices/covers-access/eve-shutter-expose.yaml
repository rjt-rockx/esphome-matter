# mirrors: eve-shutter
# Real device: Eve Shutter Switch / Eve MotionBlinds (VID 0x130A / 4874, PID 0x0060 / 96), Thread.
# Source: HA fixture eve_shutter.json (evidence=dump), DCL for the MotionBlinds PIDs.
# Real shape: EP1 window_covering (rev 3) with WindowCovering features LF+PA_LF, Type 0 (RollerShade),
# plus the manufacturer cluster 0x130AFC01. Root has OTA requestor.
# Mirrors: a time_based cover on two relays (the usual ESPHome shutter build).
# Differs: no manufacturer cluster, Wi-Fi instead of Thread, no OTA requestor (needs matter OTA config).
#
# Variant (a): expose shorthand. `expose:` has no cover inference rule yet, so `as: window_covering` is required.
esphome:
  name: matter-eve-shutter-expose

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

api:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  expose:
    - {id: shade, as: window_covering}

output:
  - platform: gpio
    id: up_out
    pin: GPIO10
  - platform: gpio
    id: down_out
    pin: GPIO11

cover:
  - platform: time_based
    id: shade
    name: Shade
    device_class: shade
    open_action:
      - output.turn_on: up_out
    open_duration: 25s
    close_action:
      - output.turn_on: down_out
    close_duration: 23s
    stop_action:
      - output.turn_off: up_out
      - output.turn_off: down_out
