# mirrors: tuya-curtain-motor
# Real device: Tuya WiFi curtain motor (ESPHome `tuya` cover, the esphome-hardware catalog row
# `tuya-curtain-motor`, evidence=doc). Matter shape of the catalog row: one window_covering endpoint with LF+PA_LF.
# Mirrors: tuya MCU cover with a position datapoint. Curtains are `device_class: curtain` (Drapery / CentralCurtain).
#
# Variant (b): explicit endpoint. The end product type can be overridden (here a left-opening lateral curtain).
esphome:
  name: matter-tuya-curtain

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

api:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  endpoints:
    1:
      window_covering:
        cover_id: curtain
        end_product_type: lateral_left_curtain

uart:
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

tuya:

cover:
  - platform: tuya
    id: curtain
    name: Curtain
    device_class: curtain
    position_datapoint: 2
    control_datapoint: 1
    invert_position: true
