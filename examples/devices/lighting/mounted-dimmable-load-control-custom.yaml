# mirrors: mock-mounted-dimmable-load-control-fixture
# Mirrors: HA fixture "mock_mounted_dimmable_load_control_fixture" (evidence=dump) and the sdk-chef
#   "mounted-dimmable-load-control" sample (a hardwired dimmable load: in-wall dimmer module, fixed fitting).
#   https://github.com/home-assistant/core/blob/dev/tests/components/matter/fixtures/nodes/mock_mounted_dimmable_load_control_fixture.json
# Hardware an ESPHome user would build: in-wall dimmer module (ac_dimmer output + monochromatic light).
# Representation (c): bare device type + on_attribute/set_attribute, because `light_id` is not accepted by
#   mounted_dimmable_load_control (see _blocked/mounted-dimmable-load-control-light-id.yaml).
# Matches: mounted_dimmable_load_control (0x0110), OnOff[LT], LevelControl[OO,LT].
# Differs: esp-matter adds ScenesManagement (the real mock has none); MinLevel/MaxLevel exist here but not on the mock.
# See research/devices/repro-lighting.md.

substitutions:
  name: matter-mounted-dimmer

esphome:
  name: ${name}

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:
api:
network:
  enable_ipv6: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

output:
  - platform: ac_dimmer
    id: dimmer_out
    gate_pin: GPIO10
    zero_cross_pin:
      number: GPIO11
      mode: {input: true}
      inverted: true

light:
  - platform: monochromatic
    id: load
    name: "Load"
    output: dimmer_out
    restore_mode: ALWAYS_OFF
    on_state:
      then:
        - matter.set_attribute:
            path: 1.on_off.on_off
            value: !lambda return id(load).remote_values.is_on();
        - matter.set_attribute:
            path: 1.level_control.current_level
            value: !lambda |-
              return std::max<uint64_t>(
                  static_cast<uint64_t>(std::lroundf(id(load).remote_values.get_brightness() * 254.0f)), 1);

matter:
  endpoints:
    1:
      mounted_dimmable_load_control:
      on_attribute:
        on_off.on_off:
          then:
            - light.control:
                id: load
                state: !lambda return value;
                transition_length: 0s
        level_control.current_level:
          then:
            - light.control:
                id: load
                brightness: !lambda return value / 254.0f;
                transition_length: 0s
