# mirrors: color-temperature-light
# Mirrors: HA fixture "color_temperature_light" (Signify Mock, VID 0x100B, evidence=dump)
#   https://github.com/home-assistant/core/blob/dev/tests/components/matter/fixtures/nodes/color_temperature_light.json
# Hardware an ESPHome user would build: tunable-white (cold + warm PWM) bulb or strip.
# Representation (a): `expose:` shorthand. `platform: cwww` infers color_temperature_light.
# Matches: color_temperature_light (0x010C), OnOff[LT], LevelControl[OO,LT], ColorControl[CT] (ColorCapabilities 16),
#   ColorTempPhysicalMin/Max from the cold/warm white temperatures (153/500 mireds, same as the real mock).
# Differs: no ModeSelect; ScenesManagement added by the newer device type revision.
# See research/devices/repro-lighting.md.

substitutions:
  name: matter-ct-light

esphome:
  name: ${name}

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:
api:
network:
  enable_ipv6: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

output:
  - {platform: ledc, id: out_cw, pin: GPIO6}
  - {platform: ledc, id: out_ww, pin: GPIO7}

light:
  - platform: cwww
    id: ct_bulb
    name: "CT Bulb"
    cold_white: out_cw
    warm_white: out_ww
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2000 K
    restore_mode: ALWAYS_OFF

matter:
  expose: [{id: ct_bulb, endpoint: 1}]
