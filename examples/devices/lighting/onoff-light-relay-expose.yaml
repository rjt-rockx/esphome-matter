# mirrors: mock-onoff-light
# Mirrors: HA fixture "mock_onoff_light" (Nabu Casa Mock Light, evidence=dump), also the sdk-chef on/off light
#   https://github.com/home-assistant/core/blob/dev/tests/components/matter/fixtures/nodes/mock_onoff_light.json
# Hardware an ESPHome user would build: a relay (GPIO) that switches a lamp. ESPHome models it as a `switch`, and
#   `expose` maps a switch to on_off_plug_in_unit unless told otherwise, so the override `as: on_off_light` is the
#   thing to learn here.
# Representation (a): `expose:` with `as: on_off_light`.
# Matches: on_off_light (0x0100), Identify, Groups, OnOff[LT], Descriptor.
# Differs: ScenesManagement; FixedLabel "Lamp"; no Switch cluster / UserLabel on the root node (SDK example leftovers).
# See research/devices/repro-lighting.md.

substitutions:
  name: matter-relay-lamp

esphome:
  name: ${name}

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:
api:
network:
  enable_ipv6: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch:
  - platform: gpio
    id: lamp_relay
    name: "Lamp"
    pin: GPIO10
    restore_mode: ALWAYS_OFF

matter:
  expose:
    - {id: lamp_relay, as: on_off_light, endpoint: 1}
