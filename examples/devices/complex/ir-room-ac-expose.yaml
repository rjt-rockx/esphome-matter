# mirrors: ir-room-ac-climate
# Variant (a) of ir-room-ac.yaml: the `expose:` shorthand. A `climate` is inferred as a plain Thermostat (0x0301); the
# user must say `as: room_air_conditioner` (DIRECTION §6: "room AC = one endpoint"). The room sensor is a separate
# endpoint; `expose` has no `parent:`/`attach_to` that nests the sensor below the RAC (attach_to merges clusters into
# the same endpoint instead, which is not the RAC composition real devices use).
#
# Matches ir-room-ac.yaml for the RAC endpoint; differs: the temperature sensor is a root-level sibling, not a part of
# the RAC endpoint (use `endpoints:` to nest, GAP-EXPOSE-PARENT).

esphome:
  name: matter-ir-ac-expose

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:
api:
network:
  enable_ipv6: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  expose:
    - {id: bedroom_ac, as: room_air_conditioner}
    - room_temperature

remote_transmitter:
  id: ir_tx
  pin: GPIO2
  carrier_duty_percent: 50%

one_wire:
  - platform: gpio
    pin: GPIO3

sensor:
  - platform: dallas_temp
    id: room_temperature
    name: Room temp
    address: 0x1c0000031edd2a28
    update_interval: 30s

climate:
  - platform: coolix
    id: bedroom_ac
    name: Bedroom AC
    transmitter_id: ir_tx
    sensor: room_temperature
    visual:
      min_temperature: 17 °C
      max_temperature: 30 °C
      temperature_step: 1 °C
