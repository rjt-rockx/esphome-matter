# mirrors: mock-room-airconditioner
# Variant (c) of ir-room-ac.yaml, and the general "IR blaster" device (Broadlink / SwitchBot Hub 2 / Aqara hub IR
# style, research/devices/consumer-products.jsonl switchbot-hub-2-pid07e7 = Aggregator, bridged IR remotes unknown to
# the DCL). Each IR target is its own Matter accessory: AC (Room Air Conditioner), TV (on/off plug-in unit; there is no
# Matter TV device type for IR-only control, Basic Video Player needs the Media clusters) and a ceiling fan on/off.
# All three are Bridged Nodes below one Aggregator (spike-bridge `bridged_node:`), so Apple/Google show three
# separate accessories that can be put in separate rooms.
#
# Matches the Fritz/Hue gateway shape: Aggregator + Bridged Node endpoints with an application type each.
# Differs: only fixed, YAML-declared IR targets (a hub that learns codes would need runtime endpoints); the TV switch
# is a template switch that sends an NEC code in turn_on/turn_off_action and so reports assumed state.

esphome:
  name: matter-ir-hub
  friendly_name: Matter IR Hub

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:
api:
network:
  enable_ipv6: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  endpoints:
    1:
      aggregator: {}
    2:
      bridged_node: {name: Bedroom AC, parent: 1}
      room_air_conditioner:
        climate_id: bedroom_ac
    3:
      bridged_node: {name: TV, parent: 1}
      on_off_plug_in_unit:
        switch_id: tv_power
    4:
      bridged_node: {name: Ceiling fan, parent: 1}
      on_off_plug_in_unit:
        switch_id: fan_power

remote_transmitter:
  id: ir_tx
  pin: GPIO2
  carrier_duty_percent: 50%

remote_receiver:
  pin: {number: GPIO4, inverted: true, mode: INPUT_PULLUP}
  dump: all

climate:
  - platform: coolix
    id: bedroom_ac
    name: Bedroom AC
    transmitter_id: ir_tx

switch:
  - platform: template
    id: tv_power
    name: TV
    optimistic: true
    turn_on_action:
      - remote_transmitter.transmit_nec: {address: 0x04, command: 0x08}
    turn_off_action:
      - remote_transmitter.transmit_nec: {address: 0x04, command: 0x08}
  - platform: template
    id: fan_power
    name: Ceiling fan
    optimistic: true
    turn_on_action:
      - remote_transmitter.transmit_nec: {address: 0x00, command: 0x12}
    turn_off_action:
      - remote_transmitter.transmit_nec: {address: 0x00, command: 0x13}
