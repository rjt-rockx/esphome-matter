# mirrors: silabs-laundrywasher
# Mirrors: a washing machine (Laundry Washer 0x0073). Real dump: HA fixture silabs_laundrywasher (EP1 Laundry Washer with
# Identify, Binding, LaundryWasherMode, LaundryWasherControls FM=3 (spin|rinse), TemperatureControl FM=2 (level),
# OperationalState; EP2 Electrical Sensor with EPM FM=31, EEM FM=5, Power Topology FM=12 = SET|DYNAMIC, a sibling with
# no parent). The dishwasher fixture silabs_dishwasher is the same shape (Dishwasher 0x0075 + Dishwasher Mode + Dishwasher
# Alarm + OperationalState, meter on EP2). Both are Silabs reference apps, not shipping products.
# ESPHome side: a retrofit controller for an existing washer: a relay for "start", a power meter (CSE7766 plug) and
# a template text_sensor for the program phase.
#
# FEASIBILITY (esp-matter 1.6): the device type, LaundryWasherMode, LaundryWasherControls, TemperatureControl and
# Operational State clusters can be CREATED (this file compiles in --only-generate), but they are delegate-driven
# (esp_matter_delegate_callbacks.cpp: OperationalState::Instance, LaundryWasherControls::Delegate, mode delegates). Without
# a delegate: ChangeToMode/Start/Stop/Pause commands are not created (checker: CL-CMD-MISSING), OperationalState keeps its
# initial state. The only live part is the electrical sensor sibling. A controller sees "a washer" that never changes state.
# Minimal path (GAP-APPLIANCE-DELEGATES): a generic `matter_operational_state.cpp` delegate exposing OperationalState,
# bound to a template text_sensor/select + start/pause/stop actions, size M-L; modes and controls need one delegate each.

esphome:
  name: matter-washer

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:
api:
network:
  enable_ipv6: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  endpoints:
    1:
      laundry_washer:
        with_features: [spin, rinse, temperature_level]
      clusters:
        laundry_washer_mode: {}
        laundry_washer_controls: {}
        temperature_control: {}
        operational_state: {}
    2:
      electrical_sensor:
        active_power: washer_power
        voltage: washer_voltage
        active_current: washer_current
        energy_imported: washer_energy

uart:
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 4800
  parity: EVEN

sensor:
  - platform: cse7766
    voltage: {id: washer_voltage, name: Washer voltage}
    current: {id: washer_current, name: Washer current}
    power: {id: washer_power, name: Washer power}
    energy: {id: washer_energy, name: Washer energy, unit_of_measurement: kWh, filters: [{multiply: 0.001}], state_class: total_increasing, device_class: energy}

switch:
  - {platform: gpio, id: start_relay, name: Start button, pin: GPIO4}

text_sensor:
  - platform: template
    id: washer_phase
    name: Washer phase
    lambda: |-
      return id(washer_power).state > 300 ? std::string("running") : std::string("idle");
