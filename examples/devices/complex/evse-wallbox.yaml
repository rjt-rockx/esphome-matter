# mirrors: silabs-evse-charging
# Mirrors: a Matter EVSE (EV charger). Real dump: HA fixture silabs_evse_charging (Silicon Labs EVSE app, EP1 with FIVE
# stacked device types: Energy EVSE 0x050C, Device Energy Management 0x050D, Electrical Sensor 0x0510, Power Source 0x0011;
# clusters EnergyEvse FM=9 (ChargingPreferences|RFID? bit0+bit3), EnergyEvseMode, DeviceEnergyManagement FM=123, DEM Mode,
# ElectricalPowerMeasurement FM=31, ElectricalEnergyMeasurement FM=15, PowerTopology FM=1 (NODE), PowerSource FM=1 wired).
# Also research/devices/consumer-products.jsonl quectel-matter-evse-pidff11 and sdk-chb-evse-energy.
#
# ESPHome side (a DIY single-phase wallbox): J1772 pilot as 1 kHz PWM on a ledc output with an ADC read-back, a
# contactor relay (gpio switch), a PZEM-004T v3 for power/energy and a template number for the current limit.
#
# THIS IS A STRUCTURE-ONLY MODEL. The endpoint, device types and clusters are created exactly like the Silabs dump, but
# nothing binds them to the wallbox: esp-matter's Energy EVSE, Device Energy Management and Power Topology are
# delegate-driven clusters (esp-matter data_model/esp_matter_delegate_callbacks.cpp: EnergyEvse::Instance needs an
# EnergyEvse::Delegate; the component never sets one; docs/actions.md: "some attributes require delegates in esp-matter
# and this has also not been implemented yet"). Without a delegate the cluster Instance is never created at runtime:
# controllers see the cluster in the Descriptor but commands (EnableCharging, Disable ...) fail and attributes stay at
# their defaults. The measurement values (power, energy) DO work because electrical_sensor is bound to real sensors.
# See docs/repro-complex.md for the minimal path to a working EVSE (a `matter_evse.cpp` delegate bound to ESPHome
# entities, size L).

esphome:
  name: matter-evse
  friendly_name: Matter EVSE

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:
api:
network:
  enable_ipv6: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  endpoints:
    1:
      id: evse_endpoint
      evse:
        with_features: [charging_preferences]
      electrical_sensor:
        voltage: evse_voltage
        active_current: evse_current
        active_power: evse_power
        energy_imported: evse_energy
      device_energy_management:
        with_features: [power_forecast_reporting, power_adjustment, pausable]
      power_source:
        with_features: [wired]
      # clusters: {device_energy_management_mode: {}} would add the DEM Mode cluster of the Silabs dump, but then the
      # checker reports ChangeToMode as missing: esp-matter only creates mode commands when a delegate exists.

uart:
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

sensor:
  - platform: pzemac
    voltage: {id: evse_voltage, name: EVSE voltage}
    current: {id: evse_current, name: EVSE current}
    power: {id: evse_power, name: EVSE power}
    energy:
      id: evse_energy
      name: EVSE energy
      unit_of_measurement: kWh
      filters: [{multiply: 0.001}]
      state_class: total_increasing
      device_class: energy
    update_interval: 5s

output:
  - platform: ledc
    id: pilot_pwm
    pin: GPIO4
    frequency: 1000 Hz

switch:
  - platform: gpio
    id: contactor
    name: Charge contactor
    pin: GPIO5
    restore_mode: ALWAYS_OFF

number:
  - platform: template
    id: max_current
    name: Max charge current
    min_value: 6
    max_value: 32
    step: 1
    unit_of_measurement: A
    optimistic: true
    initial_value: 16
    set_action:
      # 6 A = 10 % duty, 1 % duty = 0.6 A (J1772)
      - output.set_level:
          id: pilot_pwm
          level: !lambda return x / 60.0;
