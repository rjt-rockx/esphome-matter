# mirrors: silabs-water-heater
# Mirrors: an electric hot-water tank. Real dump: HA fixture silabs_water_heater (EP2 with Water Heater 0x050F + Device
# Energy Management 0x050D + Electrical Sensor 0x0510; clusters Thermostat FM=1 (Heating), WaterHeaterMode,
# WaterHeaterManagement FM=3, DEM FM=123, DEM Mode, EPM FM=31, EEM FM=15, PowerTopology NODE).
# ESPHome side: DS18B20 tank sensor, a heater relay, `climate: thermostat` for the setpoint, PZEM for metering.
#
# Variant (b), explicit: `water_heater` stacked with `electrical_sensor` on one endpoint. The Thermostat cluster that
# the Water Heater device type requires is created by esp-matter with the `heating` feature, but there is NO `climate_id`
# binding for `water_heater` (it exists only for `thermostat` / `room_air_conditioner`), so the setpoint and local
# temperature are not connected to the ESPHome climate. Measurements are real (electrical_sensor bound), WaterHeaterMode
# and WaterHeaterManagement are structure-only (delegate driven). See water-heater-thermostat.yaml for the pragmatic
# alternative that really controls the boiler.

esphome:
  name: matter-water-heater

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:
api:
network:
  enable_ipv6: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  endpoints:
    1:
      water_heater:
        with_features: [heating, energy_management, tank_percent]
      electrical_sensor:
        voltage: tank_voltage
        active_current: tank_current
        active_power: tank_power
        energy_imported: tank_energy
      device_energy_management:
        with_features: [power_forecast_reporting, power_adjustment]

uart:
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

one_wire:
  - platform: gpio
    pin: GPIO3

sensor:
  - platform: dallas_temp
    id: tank_temperature
    name: Tank temperature
    update_interval: 15s
  - platform: pzemac
    voltage: {id: tank_voltage, name: Tank voltage}
    current: {id: tank_current, name: Tank current}
    power: {id: tank_power, name: Tank power}
    energy:
      id: tank_energy
      name: Tank energy
      unit_of_measurement: kWh
      filters: [{multiply: 0.001}]
      state_class: total_increasing
      device_class: energy

switch:
  - platform: gpio
    id: heater_relay
    pin: GPIO10

climate:
  - platform: thermostat
    id: boiler
    name: Boiler
    sensor: tank_temperature
    min_idle_time: 60s
    min_heating_off_time: 60s
    min_heating_run_time: 60s
    visual: {min_temperature: 30 °C, max_temperature: 75 °C, temperature_step: 1 °C}
    default_preset: Normal
    preset:
      - name: Normal
        default_target_temperature_low: 55 °C
    heat_action:
      - switch.turn_on: heater_relay
    idle_action:
      - switch.turn_off: heater_relay
