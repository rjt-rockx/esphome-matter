# mirrors: sdk-chef-heat-pump-energy
# Mirrors: a heat pump (Matter 1.4 Heat Pump 0x0309). Source: connectedhomeip chef sample rootnode_heatpump (evidence=dump
# of the ZAP, no shipping product): EP1 Heat Pump + Power Source + Electrical Sensor + Device Energy Management (stacked
# on ONE endpoint), EP2 and EP3 Temperature Sensors (flow / return temperature); the pump is a *client* of a Thermostat.
# ESPHome side: a Modbus heat pump (modbus_controller), flow/return DS18B20s, PZEM energy meter.
#
# The Matter Heat Pump device type is built from EP1 above; the Thermostat that controls it lives in another device
# (client cluster, not expressible: GAP-CLIENT-CLUSTERS). Here the ESPHome `climate` offers the setpoint via a separate
# Thermostat endpoint, which is how the heat pump would actually be controlled from Apple/Google today.
#
# Differs from the sample: DEM and Mode clusters are structure only (no delegate), Heat Pump itself has no ESPHome
# binding (it is a pure container), Thermostat is an extra endpoint (EP4), flow/return sensors are plain endpoints.

esphome:
  name: matter-heat-pump

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:
api:
network:
  enable_ipv6: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  endpoints:
    1:
      heat_pump: {}
      power_source:
        with_features: [wired]
      electrical_sensor:
        active_power: hp_power
        voltage: hp_voltage
        energy_imported: hp_energy
      device_energy_management:
        with_features: [power_forecast_reporting, power_adjustment]
    2:
      temperature_sensor: flow_temperature
    3:
      temperature_sensor: return_temperature
    4:
      thermostat:
        climate_id: hp_climate

uart:
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

modbus:
  id: hp_bus

modbus_controller:
  - id: hp
    address: 1
    modbus_id: hp_bus
    update_interval: 15s

sensor:
  - {platform: modbus_controller, modbus_controller_id: hp, id: flow_temperature, name: Flow temperature, address: 0x0100, register_type: holding, value_type: S_WORD, unit_of_measurement: "°C", device_class: temperature, filters: [{multiply: 0.1}]}
  - {platform: modbus_controller, modbus_controller_id: hp, id: return_temperature, name: Return temperature, address: 0x0101, register_type: holding, value_type: S_WORD, unit_of_measurement: "°C", device_class: temperature, filters: [{multiply: 0.1}]}
  - {platform: modbus_controller, modbus_controller_id: hp, id: hp_power, name: Heat pump power, address: 0x0110, register_type: holding, value_type: U_WORD, unit_of_measurement: W, device_class: power}
  - {platform: modbus_controller, modbus_controller_id: hp, id: hp_voltage, name: Heat pump voltage, address: 0x0111, register_type: holding, value_type: U_WORD, unit_of_measurement: V, device_class: voltage, filters: [{multiply: 0.1}]}
  - {platform: modbus_controller, modbus_controller_id: hp, id: hp_energy, name: Heat pump energy, address: 0x0112, register_type: holding, value_type: U_DWORD, unit_of_measurement: kWh, device_class: energy, state_class: total_increasing, filters: [{multiply: 0.1}]}

switch:
  - platform: modbus_controller
    modbus_controller_id: hp
    id: hp_run
    register_type: coil
    address: 0x0001
    internal: true

climate:
  - platform: thermostat
    id: hp_climate
    name: Heat pump
    sensor: flow_temperature
    min_idle_time: 120s
    min_heating_off_time: 120s
    min_heating_run_time: 120s
    visual: {min_temperature: 20 °C, max_temperature: 55 °C, temperature_step: 1 °C}
    default_preset: Normal
    preset:
      - name: Normal
        default_target_temperature_low: 35 °C
    heat_action:
      - switch.turn_on: hp_run
    idle_action:
      - switch.turn_off: hp_run
