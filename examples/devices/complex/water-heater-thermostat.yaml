# mirrors: silabs-water-heater
# Variant (a) of water-heater.yaml: the pragmatic form that really works. The boiler is a plain Matter Thermostat
# (0x0301, heat only) bound to the ESPHome climate (setpoint + local temperature + running state, two-way), plus a
# SEPARATE Electrical Sensor endpoint for the PZEM. Every controller understands a heat-only thermostat; none (HA,
# Apple, Google) renders the Water Heater device type, WaterHeaterMode or tank percent today, so little is lost.
# Differs from the dump: no Water Heater device type (0x050F), no DEM/WaterHeaterManagement, meter is a sibling
# (the Eve plug 'patched' dump uses the same sibling shape, EP3 NODE topology without a link to the load).

esphome:
  name: matter-boiler

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:
api:
network:
  enable_ipv6: true
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  expose:
    - {id: boiler, as: thermostat, label: Boiler}   # GAP: climate is not inferred yet, `as:` is required
  endpoints:
    10:
      electrical_sensor:
        voltage: tank_voltage
        active_current: tank_current
        active_power: tank_power
        energy_imported: tank_energy

uart:
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

one_wire:
  - platform: gpio
    pin: GPIO3

sensor:
  - platform: dallas_temp
    id: tank_temperature
    name: Tank temperature
    update_interval: 15s
  - platform: pzemac
    voltage: {id: tank_voltage, name: Tank voltage}
    current: {id: tank_current, name: Tank current}
    power: {id: tank_power, name: Tank power}
    energy:
      id: tank_energy
      name: Tank energy
      unit_of_measurement: kWh
      filters: [{multiply: 0.001}]
      state_class: total_increasing
      device_class: energy

switch:
  - platform: gpio
    id: heater_relay
    pin: GPIO10

climate:
  - platform: thermostat
    id: boiler
    name: Boiler
    sensor: tank_temperature
    min_idle_time: 60s
    min_heating_off_time: 60s
    min_heating_run_time: 60s
    visual: {min_temperature: 30 °C, max_temperature: 75 °C, temperature_step: 1 °C}
    default_preset: Normal
    preset:
      - name: Normal
        default_target_temperature_low: 55 °C
    heat_action:
      - switch.turn_on: heater_relay
    idle_action:
      - switch.turn_off: heater_relay
