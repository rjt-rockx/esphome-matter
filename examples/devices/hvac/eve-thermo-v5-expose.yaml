# mirrors: eve-thermo-v5
# Mirrors: Eve Thermo (5th gen), see ../eve-thermo-v5.yaml.  Variant (a) `expose:` shorthand.
# STATUS: does not validate on this branch.  `battery_level` (a battery-% sensor) has no inference rule yet, and
# `climate` needs `as:`.  DIRECTION s6 wants: climate -> thermostat, sensor battery -> node Power Source on EP0
# (EndpointList = application endpoints).  With those rules the natural expression is just:
#       expose: [radiator, battery_level]
# which is what this file asks for apart from the explicit `as:` that is needed today.

substitutions:
  name: matter-radiator-valve-expose
  board: esp32-c6-devkitc-1
  variant: ESP32C6

esphome:
  name: ${name}

esp32:
  board: ${board}
  variant: ${variant}
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  expose:
    - {id: radiator, as: thermostat}
    - battery_level          # wanted: node Power Source (M3); today: error, no rule for a battery sensor

sensor:
  - platform: ntc
    sensor: ntc_resistance
    id: room_temperature
    calibration:
      - 10kOhm -> 25°C
      - 27.219kOhm -> 0°C
      - 14.085kOhm -> 15°C
    unit_of_measurement: °C
    device_class: temperature
  - platform: resistance
    id: ntc_resistance
    sensor: ntc_adc
    configuration: DOWNSTREAM
    resistor: 10kOhm
    internal: true
  - platform: adc
    id: ntc_adc
    pin: GPIO0
    attenuation: 12db
    update_interval: 30s
    internal: true
  - platform: template
    id: battery_level
    name: Battery
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: 5min
    lambda: |-
      return clamp((id(battery_voltage).state - 2.0f) / 1.0f * 100.0f, 0.0f, 100.0f);
  - platform: adc
    id: battery_voltage
    pin: GPIO1
    attenuation: 12db
    update_interval: 5min
    internal: true

switch:
  - platform: gpio
    id: valve_motor
    pin: GPIO10

climate:
  - platform: thermostat
    id: radiator
    name: Radiator
    sensor: room_temperature
    visual:
      min_temperature: 5 °C
      max_temperature: 30 °C
      temperature_step: 0.5 °C
    min_heating_off_time: 60s
    min_heating_run_time: 60s
    min_idle_time: 30s
    heat_action:
      - switch.turn_on: valve_motor
    idle_action:
      - switch.turn_off: valve_motor
