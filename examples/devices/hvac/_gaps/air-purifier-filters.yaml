# mirrors: mock-air-purifier
# Variant (c) power-user: air purifier with HEPA + carbon filter monitoring via `clusters:` (the dump's
# HEPAFilterMonitoring[CON,WRN,REP] / ActivatedCarbonFilterMonitoring).
# STATUS: _gaps.  Depends on B1 (`clusters:` KeyError), and even then Condition/DegradationDirection/ChangeIndication
# have no ESPHome entity to bind (a template sensor for filter life -> Condition, G11) and the purifier fan is not
# bound (G8).  Written as the YAML we would want.

substitutions:
  name: matter-air-purifier-filters
  board: esp32-c6-devkitc-1
  variant: ESP32C6

esphome:
  name: ${name}

esp32:
  board: ${board}
  variant: ${variant}
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  endpoints:
    1:
      air_purifier:
        with_features: [condition, warning, replacement_product_list]
        # wanted: fan_id: purifier_fan
      clusters:
        hepa_filter_monitoring:
          with_features: [condition, warning]
        activated_carbon_filter_monitoring:
          with_features: [condition, warning]

output:
  - platform: ledc
    id: fan_pwm
    pin: GPIO3
    frequency: 25kHz

fan:
  - platform: speed
    id: purifier_fan
    name: Purifier fan
    output: fan_pwm
    speed_count: 3
    restore_mode: ALWAYS_OFF

sensor:
  - platform: template
    id: hepa_life
    name: HEPA life
    unit_of_measurement: "%"
    lambda: return 80.0;
    update_interval: 1h
