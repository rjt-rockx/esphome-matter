# mirrors: longan-link-hvac-thermostat-fan
# Mirrors: Longan Link HVAC thermostat, HA fixture longan_link_thermostat.json (evidence=dump, Wi-Fi)
#   EP1 thermostat (0x0301): Groups, OnOff, Binding, FixedLabel, Thermostat[HEAT,COOL,AUTO], FanControl,
#       ThermostatUserInterfaceConfiguration (thermostat device type with FanControl/OnOff SERVER clusters added)
# Natural build: ESPHome `thermostat` climate with fan_mode actions.  The spec-correct shape for "thermostat + fan +
# on/off in one endpoint" is the Room Air Conditioner type, used here (variant b); the literal dump shape would be
# thermostat + `clusters: {on_off, fan_control}`.
# STATUS: _gaps, depends on B1 (`clusters:` KeyError, fixed separately).
#
# Matches:  one endpoint with Thermostat + OnOff + FanControl.
# Differs:  device type is RAC (0x0072) not Thermostat (0x0301): ACCEPTABLE, strictly more correct (the dump itself is
#           REAL-DEVICE-NONCONFORMANT-ish: FanControl/OnOff servers are not in the Thermostat device type).
#           FanControl is not bound to the climate fan modes (G1).  FixedLabel/Binding/UI config absent (G7).

substitutions:
  name: matter-hvac-fan
  board: esp32-c6-devkitc-1
  variant: ESP32C6

esphome:
  name: ${name}

esp32:
  board: ${board}
  variant: ${variant}
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  endpoints:
    1:
      room_air_conditioner:
        climate_id: hvac
      clusters:
        fan_control:
          with_features: [multi_speed, auto]

sensor:
  - platform: dht
    pin: GPIO3
    model: DHT22
    temperature:
      id: room_temperature

switch:
  - platform: gpio
    id: heat_relay
    pin: GPIO10
  - platform: gpio
    id: cool_relay
    pin: GPIO11
  - platform: gpio
    id: fan_low
    pin: GPIO6
  - platform: gpio
    id: fan_high
    pin: GPIO7

climate:
  - platform: thermostat
    id: hvac
    name: HVAC
    sensor: room_temperature
    visual:
      min_temperature: 10 °C
      max_temperature: 32 °C
    min_cooling_off_time: 300s
    min_cooling_run_time: 300s
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 30s
    min_fan_mode_switching_time: 30s
    heat_action:
      - switch.turn_on: heat_relay
    cool_action:
      - switch.turn_on: cool_relay
    idle_action:
      - switch.turn_off: heat_relay
      - switch.turn_off: cool_relay
    fan_mode_auto_action:
      - switch.turn_off: fan_low
      - switch.turn_off: fan_high
    fan_mode_low_action:
      - switch.turn_on: fan_low
      - switch.turn_off: fan_high
    fan_mode_high_action:
      - switch.turn_off: fan_low
      - switch.turn_on: fan_high
