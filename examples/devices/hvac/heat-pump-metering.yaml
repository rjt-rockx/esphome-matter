# mirrors: sdk-chef-heat-pump-energy
# Mirrors: chef heat pump with energy (evidence=dump, SDK reference) / spec Heat Pump (0x0309).
#   EP1 heat_pump + power_source + electrical_sensor + device_energy_management; client Thermostat
#   EP2, EP3 temperature_sensor (flow / return)
# Natural build: air-source heat pump controller: ESPHome `thermostat` climate for the room, two DS18B20 pipe probes,
# power/energy from a meter.  Variant (c) "composed": heat_pump + electrical_sensor on EP1, the climate as a separate
# Thermostat endpoint EP2 (child of EP1), the pipe temperatures as EP3/EP4.
#
# Matches:  heat_pump + electrical_sensor on one endpoint, temperature sensors, a thermostat tied to the pump.
# Differs:  * Device Energy Management and node Power Source are not available: GAP-COMPONENT G14 (L, M5+).
#           * The dump has the Thermostat as a CLIENT cluster on EP1; we make it a server on its own endpoint,
#             because client clusters are not supported (docs/device-types.md): ACCEPTABLE alternative.
#           * heat_pump has no binding, it is a bare container: ACCEPTABLE.

substitutions:
  name: matter-heat-pump
  board: esp32-c6-devkitc-1
  variant: ESP32C6

esphome:
  name: ${name}

esp32:
  board: ${board}
  variant: ${variant}
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  endpoints:
    1:
      heat_pump:
      electrical_sensor:
        active_power: pump_power
        energy_imported: pump_energy
    2:
      parent: 1
      thermostat:
        climate_id: room_hvac
    3:
      parent: 1
      temperature_sensor: flow_temperature
    4:
      parent: 1
      temperature_sensor: return_temperature

one_wire:
  - platform: gpio
    pin: GPIO2

sensor:
  - platform: dallas_temp
    address: 0x1c0000031edd2a28
    id: flow_temperature
  - platform: dallas_temp
    address: 0x1c0000031edd2a29
    id: return_temperature
  - platform: dallas_temp
    address: 0x1c0000031edd2a30
    id: room_temperature
  - platform: template
    id: pump_power
    unit_of_measurement: W
    device_class: power
    lambda: return 0.0;
  - platform: template
    id: pump_energy
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    lambda: return 0.0;

switch:
  - platform: gpio
    id: compressor
    pin: GPIO10

climate:
  - platform: thermostat
    id: room_hvac
    name: Heat pump
    sensor: room_temperature
    visual:
      min_temperature: 10 °C
      max_temperature: 30 °C
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 60s
    heat_action:
      - switch.turn_on: compressor
    idle_action:
      - switch.turn_off: compressor
