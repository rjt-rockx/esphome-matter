# mirrors: esphome-thermostat-heat-cool
# Mirrors: same device as esphome-thermostat-heat-cool.yaml, plus the Tado TRV X humidity-on-the-thermostat shape.
# Variant (a) `expose:` shorthand (DIRECTION scenario (d): `expose: [hvac]`).
#
# Matches:  identical lowering to the explicit file (thermostat + climate_id) at a hashed endpoint number;
#           `attach_to: hvac` puts the humidity_sensor device type on the thermostat endpoint (Tado dump shape).
# Differs:  * `climate` is not inferred yet: DIRECTION s6 says climate -> thermostat so `[hvac]` alone should work;
#             today `{id: hvac, as: thermostat}` is needed (G2).
#           * Every lowered endpoint carries a FixedLabel with the entity name ("HVAC"); the real thermostats have
#             none.  DIRECTION s9 wants FixedLabel only on Duplicate siblings (`fixed_labels: duplicates`), here
#             there is no sibling.  ACCEPTABLE but noisy (G9).
#           * The temperature sensor is deliberately NOT exposed: the thermostat reports LocalTemperature itself.

substitutions:
  name: matter-thermostat-expose
  board: esp32-c6-devkitc-1
  variant: ESP32C6

esphome:
  name: ${name}

esp32:
  board: ${board}
  variant: ${variant}
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  expose:
    - {id: hvac, as: thermostat}
    - {id: room_humidity, attach_to: hvac}   # Tado shape: RH cluster on the thermostat endpoint

sensor:
  - platform: dht
    pin: GPIO3
    model: DHT22
    temperature:
      id: room_temperature
      name: Room temperature
    humidity:
      id: room_humidity
      name: Room humidity
    update_interval: 30s

switch:
  - platform: gpio
    id: heat_relay
    pin: GPIO10
  - platform: gpio
    id: cool_relay
    pin: GPIO11

climate:
  - platform: thermostat
    id: hvac
    name: HVAC
    sensor: room_temperature
    visual:
      min_temperature: 10 °C
      max_temperature: 32 °C
      temperature_step: 0.5 °C
    min_cooling_off_time: 300s
    min_cooling_run_time: 300s
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 30s
    heat_action:
      - switch.turn_on: heat_relay
      - switch.turn_off: cool_relay
    cool_action:
      - switch.turn_on: cool_relay
      - switch.turn_off: heat_relay
    idle_action:
      - switch.turn_off: heat_relay
      - switch.turn_off: cool_relay
