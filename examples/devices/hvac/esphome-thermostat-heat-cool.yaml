# mirrors: esphome-thermostat-heat-cool
# Mirrors: the plain ESPHome heat/cool thermostat (catalog `esphome-thermostat-heat-cool`, docs/climate.md) and the
#   real Resideo X2S (EP1 thermostat, Thermostat[HEAT,COOL], ControlSequence CoolingAndHeating) and Google Nest
#   Thermostat (DCL pid 0x0001) shape: a single Thermostat endpoint, local temperature inside the cluster.
#   source: home-assistant/core tests/components/matter/fixtures/nodes/resideo_x2s_thermostat.json
# Natural build: DHT22 + two relays (heat, cool) + ESPHome `thermostat` climate.
# Variant (b) explicit `endpoints:` <- this file.  -expose shows the shorthand.
#
# Matches:  thermostat device type, Heating + Cooling, ControlSequence CoolingAndHeating, LocalTemperature from the
#           climate, ThermostatRunningState from the climate action, setpoints/limits from `visual:`.
# Differs:  * ESPHome `thermostat` with heat_action AND cool_action supports HEAT_COOL, so the component adds the
#             AutoMode feature (and a MinSetpointDeadBand); the Resideo has none: ACCEPTABLE (superset).
#           * No Groups cluster on our endpoint (the dump has Groups[GN]): ACCEPTABLE, groupcast is not used.

substitutions:
  name: matter-thermostat-heat-cool
  board: esp32-c6-devkitc-1
  variant: ESP32C6

esphome:
  name: ${name}

esp32:
  board: ${board}
  variant: ${variant}
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  endpoints:
    1:
      thermostat:
        climate_id: hvac

sensor:
  - platform: dht
    pin: GPIO3
    model: DHT22
    temperature:
      id: room_temperature
      name: Room temperature
    humidity:
      id: room_humidity
      name: Room humidity
    update_interval: 30s

switch:
  - platform: gpio
    id: heat_relay
    pin: GPIO10
  - platform: gpio
    id: cool_relay
    pin: GPIO11

climate:
  - platform: thermostat
    id: hvac
    name: HVAC
    sensor: room_temperature
    visual:
      min_temperature: 10 °C
      max_temperature: 32 °C
      temperature_step: 0.5 °C
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20 °C
        default_target_temperature_high: 24 °C
        mode: HEAT_COOL
    min_cooling_off_time: 300s
    min_cooling_run_time: 300s
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 30s
    heat_action:
      - switch.turn_on: heat_relay
      - switch.turn_off: cool_relay
    cool_action:
      - switch.turn_on: cool_relay
      - switch.turn_off: heat_relay
    idle_action:
      - switch.turn_off: heat_relay
      - switch.turn_off: cool_relay
