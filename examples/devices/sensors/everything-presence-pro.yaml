# mirrors: everything-presence-pro
# Mirrors: Everything Presence Pro (ESPHome-native, catalog evidence=doc): LD2450 radar presence, PIR motion,
# SHT temperature/humidity, BH1750 lux, SCD4x CO2, relay.
# Variant (b): explicit endpoints. Two occupancy sensors are Duplicates, so the component adds Common Number tags
# (and the radar is told apart with Radar vs PIR features). Moving-target counts, distances and tamper have no Matter
# mapping and stay ESPHome-only.
esphome:
  name: everything-presence-pro

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO6
  scl: GPIO7

uart:
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 256000

ld2410:

binary_sensor:
  - platform: ld2410
    has_target:
      id: radar
      name: Presence
      device_class: presence
  - platform: gpio
    id: pir
    name: Motion
    device_class: motion
    pin: GPIO10

sensor:
  - platform: sht4x
    temperature: {id: ep_t, name: Temperature}
    humidity: {id: ep_h, name: Humidity}
  - platform: bh1750
    id: ep_lux
    name: Illuminance
  - platform: scd4x
    co2: {id: ep_co2, name: CO2}

switch:
  - platform: gpio
    id: ep_relay
    name: Relay
    pin: GPIO11

matter:
  endpoints:
    1:
      occupancy_sensor: radar
    2:
      occupancy_sensor: pir
    3:
      temperature_sensor: ep_t
    4:
      humidity_sensor:
        relative_humidity: ep_h
    5:
      light_sensor: ep_lux
    6:
      air_quality_sensor:
        carbon_dioxide: ep_co2
    7:
      on_off_plug_in_unit:
        switch_id: ep_relay
