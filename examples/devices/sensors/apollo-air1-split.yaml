# mirrors: apollo-air-1
# Mirrors: Apollo AIR-1 (ESPHome-native device, Wi-Fi; catalog entry apollo-air-1, evidence=inferred) exposed over Matter
#   https://devices.esphome.io/devices/apollo-air-1 : SEN55 (PM, VOC index, NOx index, T/H), SCD40 (CO2), DPS310 (pressure)
# Natural Matter shape per the spec: one Air Quality Sensor endpoint for the concentrations and SEPARATE Temperature,
# Humidity and Pressure Sensor endpoints. Variant (b): explicit endpoints, "split" layout.
# Compare apollo-air1-single.yaml (temperature/humidity folded into the air quality endpoint, ALPSTUGA style).
# Differs from a reference: the VOC and NOx indices (1..500, unitless) have no Matter MeasurementUnit, so they are NOT
# mapped; only CO2 and PM are. AirQuality (the Good..Hazardous enum) stays Unknown.
esphome:
  name: apollo-air1-split

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO6
  scl: GPIO7

sensor:
  - platform: sen5x
    id: sen55
    pm_1_0:
      id: pm1
      name: PM1
    pm_2_5:
      id: pm25
      name: PM2.5
    pm_4_0:
      name: PM4
    pm_10_0:
      id: pm10
      name: PM10
    temperature:
      id: air_t
      name: Temperature
    humidity:
      id: air_h
      name: Humidity
    voc:
      name: VOC index
    nox:
      name: NOx index
  - platform: scd4x
    co2:
      id: co2
      name: CO2
  - platform: dps310
    pressure:
      id: air_p
      name: Pressure

matter:
  endpoints:
    1:
      air_quality_sensor:
        carbon_dioxide: co2
        pm_1: pm1
        pm_2_5: pm25
        pm_10: pm10
    2:
      temperature_sensor: air_t
    3:
      humidity_sensor:
        relative_humidity: air_h
    4:
      pressure_sensor: air_p
