# mirrors: apollo-air-1
# GAP: aspirational `expose:` form of apollo-air1-single.yaml (DIRECTION scenario (c)). Fails today:
#   matter.expose: 'co2' cannot be exposed: no device type is inferred for this sensor (co2); use `as:`
# and `as: air_quality_sensor` cannot bind a lone sensor either (needs the group:air_quality merge).
esphome:
  name: apollo-air1-single

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO6
  scl: GPIO7

sensor:
  - platform: sen5x
    id: sen55
    pm_2_5:
      id: pm25
      name: PM2.5
    temperature:
      id: air_t
      name: Temperature
    humidity:
      id: air_h
      name: Humidity
  - platform: scd4x
    co2:
      id: co2
      name: CO2
  - platform: dps310
    pressure:
      id: air_p
      name: Pressure

matter:
  expose:
    - co2
    - pm25
    - {id: air_t, attach_to: co2}
    - {id: air_h, attach_to: co2}
    - air_p
