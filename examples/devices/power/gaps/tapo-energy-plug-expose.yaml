# mirrors: tapo-energy-plug-pid0103
# EXPECTED TO FAIL `esphome config`: `meters:` is reserved and no inference rule exists for power/energy sensors.

esphome:
  name: tapo-energy-plug-expose

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  rx_pin: GPIO20
  tx_pin: GPIO21
  baud_rate: 4800

sensor:
  - platform: bl0942
    voltage: {id: mains_voltage, name: Voltage}
    current: {id: mains_current, name: Current}
    power: {id: mains_power, name: Power}
    energy: {id: mains_energy, name: Energy}

switch:
  - platform: gpio
    id: relay
    name: Plug
    pin: GPIO4
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: button
    pin: {number: GPIO9, mode: INPUT_PULLUP, inverted: true}
    on_click:
      then:
        - switch.toggle: relay

matter:
  # DIRECTION s6: power/energy/voltage/current sensors ride on the plug endpoint as one Electrical Sensor.
  # Not implemented: the registry has no rule for them and `meters:` is reserved (docs/expose.md).
  expose:
    - relay
    - {id: mains_power, meters: relay}
    - {id: mains_energy, meters: relay}
