# mirrors: atios-knx-bridge
# Bridged form: aggregator ep1, ep29 = bridged_node + electrical_sensor, parent 1. Validates; whether the bridged node
# is usable (BridgedDeviceBasicInformation data, reachable) is not covered here.

esphome:
  name: atios-electricity-monitor-bridg

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO6
  scl: GPIO7

sensor:
  - platform: ade7953_i2c
    irq_pin: GPIO8
    voltage: {id: mains_voltage, name: Voltage}
    frequency: {id: mains_frequency, name: Frequency}
    current_a: {id: mains_current, name: Current}
    active_power_a: {id: mains_power, name: Power}
    apparent_power_a: {id: mains_apparent, name: Apparent power}
    power_factor_a: {id: mains_pf, name: Power factor}
  - platform: integration
    id: mains_energy
    name: Energy
    sensor: mains_power
    time_unit: h
    restore: true
    device_class: energy
    state_class: total_increasing

matter:
  endpoints:
    1:
      aggregator:
    29:
      parent: 1
      bridged_node:
      electrical_sensor:
        voltage: mains_voltage
        active_power: mains_power
        energy_imported: mains_energy
