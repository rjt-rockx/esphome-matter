# mirrors: sonoff-tx-wall-switch
# Variant (b): gang loads as mounted_on_off_control (ep1-3) and the touch panels as separate generic_switch endpoints
# (ep4-6). A single endpoint that is both load and button is not a spec device-type combination.

esphome:
  name: sonoff-tx-wall-switch-buttons

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch:
  - platform: gpio
    id: gang_1
    name: Gang 1
    pin: GPIO4
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: gang_2
    name: Gang 2
    pin: GPIO5
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: gang_3
    name: Gang 3
    pin: GPIO6
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: touch_1
    pin: {number: GPIO15, mode: INPUT_PULLUP, inverted: true}
    filters:
      - delayed_on_off: 20ms
    on_click:
      then:
        - switch.toggle: gang_1
  - platform: gpio
    id: touch_2
    pin: {number: GPIO16, mode: INPUT_PULLUP, inverted: true}
    filters:
      - delayed_on_off: 20ms
    on_click:
      then:
        - switch.toggle: gang_2
  - platform: gpio
    id: touch_3
    pin: {number: GPIO17, mode: INPUT_PULLUP, inverted: true}
    filters:
      - delayed_on_off: 20ms
    on_click:
      then:
        - switch.toggle: gang_3

matter:
  endpoints:
    # The load of each gang.
    1: {label: Gang 1, mounted_on_off_control: {switch_id: gang_1}}
    2: {label: Gang 2, mounted_on_off_control: {switch_id: gang_2}}
    3: {label: Gang 3, mounted_on_off_control: {switch_id: gang_3}}
    # The touch panel of each gang as a Generic Switch (button events for automations).
    4: {label: Touch 1, generic_switch: {binary_sensor_id: touch_1}}
    5: {label: Touch 2, generic_switch: {binary_sensor_id: touch_2}}
    6: {label: Touch 3, generic_switch: {binary_sensor_id: touch_3}}
