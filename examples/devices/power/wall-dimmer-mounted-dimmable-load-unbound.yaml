# mirrors: sdk-chef-mounted-dimmable-load-control
# mounted_dimmable_load_control created but unbound to the light (no light_id on this device type).

esphome:
  name: wall-dimmer-mounted-dimmable-lo

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

output:
  - platform: ledc
    id: dimmer_out
    pin: GPIO4

light:
  - platform: monochromatic
    id: load
    name: Load
    output: dimmer_out
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

binary_sensor:
  - platform: gpio
    id: paddle
    pin: {number: GPIO9, mode: INPUT_PULLUP, inverted: true}
    on_click:
      then:
        - light.toggle: load

matter:
  endpoints:
    1:
      id: dimmer_ep
      mounted_dimmable_load_control:
      # No entity binding: the light would have to be driven by hand with on_attribute / matter.set_attribute.
