# mirrors: olimex-esp32-poe-relay
# Two relays over Ethernet (LAN8720, ESP32). Two sibling plugs get Common Number tags.

esphome:
  name: olimex-esp32-poe-relay

esp32:
  variant: ESP32
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

switch:
  - platform: gpio
    id: relay_1
    name: Relay 1
    pin: GPIO32
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_2
    name: Relay 2
    pin: GPIO33
    restore_mode: ALWAYS_OFF

matter:
  expose: ["relay_*"]
