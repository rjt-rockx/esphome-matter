# mirrors: sonoff-4ch
# Variant (b): explicit endpoints with labels and pinned numbers 1-4.

esphome:
  name: sonoff-4ch-endpoints

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch:
  - platform: gpio
    id: relay_1
    name: Relay 1
    pin: GPIO4
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_2
    name: Relay 2
    pin: GPIO5
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_3
    name: Relay 3
    pin: GPIO6
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay_4
    name: Relay 4
    pin: GPIO7
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: button_1
    pin: {number: GPIO15, mode: INPUT_PULLUP, inverted: true}
    on_click:
      then:
        - switch.toggle: relay_1
  - platform: gpio
    id: button_2
    pin: {number: GPIO16, mode: INPUT_PULLUP, inverted: true}
    on_click:
      then:
        - switch.toggle: relay_2
  - platform: gpio
    id: button_3
    pin: {number: GPIO17, mode: INPUT_PULLUP, inverted: true}
    on_click:
      then:
        - switch.toggle: relay_3
  - platform: gpio
    id: button_4
    pin: {number: GPIO18, mode: INPUT_PULLUP, inverted: true}
    on_click:
      then:
        - switch.toggle: relay_4

matter:
  endpoints:
    1: {label: Relay 1, on_off_plug_in_unit: {switch_id: relay_1}}
    2: {label: Relay 2, on_off_plug_in_unit: {switch_id: relay_2}}
    3: {label: Relay 3, on_off_plug_in_unit: {switch_id: relay_3}}
    4: {label: Relay 4, on_off_plug_in_unit: {switch_id: relay_4}}
