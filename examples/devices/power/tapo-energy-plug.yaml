# mirrors: tapo-energy-plug-pid0103
# Real device: Tapo energy-monitoring plug (DCL entry, doc evidence; metering clusters inferred).
# Plug + electrical_sensor on one endpoint, metering from a BL0942.

esphome:
  name: tapo-energy-plug

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  rx_pin: GPIO20
  tx_pin: GPIO21
  baud_rate: 4800

sensor:
  - platform: bl0942
    voltage: {id: mains_voltage, name: Voltage}
    current: {id: mains_current, name: Current}
    power: {id: mains_power, name: Power}
    energy: {id: mains_energy, name: Energy}
    frequency: {id: mains_frequency, name: Frequency}

switch:
  - platform: gpio
    id: relay
    name: Plug
    pin: GPIO4
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: button
    pin: {number: GPIO9, mode: INPUT_PULLUP, inverted: true}
    on_click:
      then:
        - switch.toggle: relay

matter:
  endpoints:
    1:
      on_off_plug_in_unit:
        switch_id: relay
      electrical_sensor:
        voltage: mains_voltage
        active_current: mains_current
        active_power: mains_power
        frequency: mains_frequency
        energy_imported: mains_energy
