# mirrors: shelly-plus-1pm
# Variant (a): `expose:`. The metering sensors CANNOT be expressed (see gaps/tapo-energy-plug-expose.yaml), so the
# node lacks the Electrical Sensor: GAP-COMPONENT.

esphome:
  name: shelly-plus-1pm-expose

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch:
  - platform: gpio
    id: relay
    name: Relay
    pin: GPIO10
    restore_mode: ALWAYS_OFF

binary_sensor:
  # The wall switch input SW. A real switch changes state, a push button pulses.
  - platform: gpio
    id: sw_input
    name: Input
    pin: {number: GPIO2, mode: INPUT_PULLUP, inverted: true}
    filters:
      - delayed_on_off: 20ms

sensor:
  - platform: hlw8012
    model: BL0937
    sel_pin: {number: GPIO5, inverted: true}
    cf_pin: GPIO6
    cf1_pin: GPIO7
    current_resistor: 0.001 ohm
    voltage_divider: 2351
    voltage: {id: mains_voltage, name: Voltage}
    current: {id: mains_current, name: Current}
    power: {id: mains_power, name: Power}
    energy: {id: mains_energy, name: Energy}

  # Board temp from an NTC on an ADC pin.
  - platform: adc
    id: ntc_adc
    pin: GPIO3
    attenuation: 12db
    update_interval: 10s
    internal: true
  - platform: resistance
    id: ntc_resistance
    sensor: ntc_adc
    configuration: DOWNSTREAM
    resistor: 10kohm
    internal: true
  - platform: ntc
    id: board_temp
    name: Board temp
    sensor: ntc_resistance
    calibration:
      b_constant: 3350
      reference_temperature: 25 °C
      reference_resistance: 10kohm

matter:
  expose:
    - relay
    - {id: sw_input, as: generic_switch}
    - board_temp
    # voltage/current/power/energy cannot be listed: no inference rule and `meters:` is reserved (see gaps/).
