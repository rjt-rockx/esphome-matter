# mirrors: sonoff-tx-wall-switch
# Real device: Sonoff TX style 3-gang wall switch (inferred composition: mounted_on_off_control + Switch cluster per gang).
# Variant (a): `expose` with `as: mounted_on_off_control`. Touch panels stay local ESPHome toggles.
# Differs: no Switch cluster on the gang endpoint; see -buttons.

esphome:
  name: sonoff-tx-wall-switch

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch:
  - platform: gpio
    id: gang_1
    name: Gang 1
    pin: GPIO4
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: gang_2
    name: Gang 2
    pin: GPIO5
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: gang_3
    name: Gang 3
    pin: GPIO6
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: touch_1
    pin: {number: GPIO15, mode: INPUT_PULLUP, inverted: true}
    filters:
      - delayed_on_off: 20ms
    on_click:
      then:
        - switch.toggle: gang_1
  - platform: gpio
    id: touch_2
    pin: {number: GPIO16, mode: INPUT_PULLUP, inverted: true}
    filters:
      - delayed_on_off: 20ms
    on_click:
      then:
        - switch.toggle: gang_2
  - platform: gpio
    id: touch_3
    pin: {number: GPIO17, mode: INPUT_PULLUP, inverted: true}
    filters:
      - delayed_on_off: 20ms
    on_click:
      then:
        - switch.toggle: gang_3

matter:
  expose:
    - {id: "gang_*", as: mounted_on_off_control}
