# mirrors: sonoff-s31
# Real device: Sonoff S31 (ESP8266 originally; this is the same hardware idea on an ESP32-C6 board), CSE7766 metering.
# Single endpoint: plug + electrical sensor with apparent power and power factor.

esphome:
  name: sonoff-s31

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  rx_pin: GPIO20
  baud_rate: 4800
  parity: EVEN

switch:
  - platform: gpio
    id: relay
    name: Relay
    pin: GPIO10
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: button
    pin: {number: GPIO2, mode: INPUT_PULLUP, inverted: true}
    on_click:
      then:
        - switch.toggle: relay

sensor:
  - platform: cse7766
    voltage: {id: mains_voltage, name: Voltage}
    current: {id: mains_current, name: Current}
    power: {id: mains_power, name: Power}
    energy: {id: mains_energy, name: Energy}
    apparent_power: {id: mains_apparent_power, name: Apparent power}
    power_factor: {id: mains_power_factor, name: Power factor}

matter:
  endpoints:
    1:
      on_off_plug_in_unit:
        switch_id: relay
      electrical_sensor:
        voltage: mains_voltage
        active_current: mains_current
        active_power: mains_power
        apparent_power: mains_apparent_power
        power_factor: mains_power_factor
        energy_imported: mains_energy
