# mirrors: eve-energy-plug
# Real device: Eve Energy (Thread), HA fixture eve_energy_plug.json, evidence=dump.
# Variant (a): `expose:` shorthand. Relay + local push button (plain ESPHome toggle).
# Matches: one on_off_plug_in_unit, OnOff[LT], Thread (NetworkCommissioning TH).
# Differs: no Eve vendor cluster 0x130AFC01 (carries metering in the real device; see eve-energy-plug-metered-*);
#   ours adds ScenesManagement and lacks Groups GN; endpoint number is a hash (real: 1).

esphome:
  name: eve-energy-plug

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

openthread:
  tlv: !secret thread_tlv

switch:
  - platform: gpio
    id: relay
    name: Plug
    pin: GPIO4
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: button
    pin: {number: GPIO9, mode: INPUT_PULLUP, inverted: true}
    on_click:
      then:
        - switch.toggle: relay

matter:
  expose: [relay]
