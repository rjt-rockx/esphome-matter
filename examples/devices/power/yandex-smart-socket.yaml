# mirrors: yandex-smart-socket
# Real device: Yandex smart socket (Wi-Fi), HA fixture yandex_smart_socket.json, evidence=dump: plug + legacy
# ElectricalMeasurement 0x0B04 + vendor clusters. Ours uses the modern Electrical Sensor on the plug endpoint.

esphome:
  name: yandex-smart-socket

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch:
  - platform: gpio
    id: relay
    name: Plug
    pin: GPIO4
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: button
    pin: {number: GPIO9, mode: INPUT_PULLUP, inverted: true}
    on_click:
      then:
        - switch.toggle: relay

sensor:
  # BL0937 metering chip (same driver as HLW8012).
  - platform: hlw8012
    model: BL0937
    sel_pin: {number: GPIO5, inverted: true}
    cf_pin: GPIO6
    cf1_pin: GPIO7
    current_resistor: 0.001 ohm
    voltage_divider: 2351
    voltage: {id: mains_voltage, name: Voltage}
    current: {id: mains_current, name: Current}
    power: {id: mains_power, name: Power}
    energy: {id: mains_energy, name: Energy}

matter:
  endpoints:
    1:
      on_off_plug_in_unit:
        switch_id: relay
      electrical_sensor:
        voltage: mains_voltage
        active_current: mains_current
        active_power: mains_power
        energy_imported: mains_energy
