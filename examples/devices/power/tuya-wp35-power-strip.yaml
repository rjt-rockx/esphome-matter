# mirrors: tuya-wp35-matter-strip-usb
# Real device: Tuya WP35 style strip, 4 outlets + one USB switch (doc evidence, inferred layout).
# Variant (a): `expose:` with a glob. Five sibling plugs get Common Number tags One..Five.

esphome:
  name: tuya-wp35-power-strip

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch:
  - platform: gpio
    id: outlet_1
    name: Outlet 1
    pin: GPIO4
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: outlet_2
    name: Outlet 2
    pin: GPIO5
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: outlet_3
    name: Outlet 3
    pin: GPIO6
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: outlet_4
    name: Outlet 4
    pin: GPIO7
    restore_mode: ALWAYS_OFF
  # The USB ports share one switch.
  - platform: gpio
    id: usb
    name: USB
    pin: GPIO8
    restore_mode: ALWAYS_OFF

matter:
  expose:
    - "outlet_*"
    - usb
