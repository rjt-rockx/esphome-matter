# A heat-only thermostat: a temperature sensor and a relay driving a heater, controlled by the ESPHome `thermostat`
# climate platform. Pointing the Matter `thermostat` device type to the climate entity with `climate_id` keeps both in
# sync. The Matter features (Heating, Cooling, AutoMode) are derived from the climate, so this one exposes Heating only.
# See docs/climate.md.

esphome:
  name: matter-thermostat

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3

external_components:
  - source: github://DavidvtWout/esphome-matter@main

api:

ota:
  platform: esphome

logger:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  endpoints:
    1:
      thermostat:
        climate_id: room_heater

sensor:
  - platform: dht
    pin: GPIO4
    model: DHT22
    temperature:
      id: room_temperature
    update_interval: 30s

switch:
  - platform: gpio
    id: heater_relay
    pin: GPIO5

climate:
  - platform: thermostat
    id: room_heater
    name: Room heater
    sensor: room_temperature
    visual:
      min_temperature: 5 °C
      max_temperature: 30 °C
      temperature_step: 0.5 °C
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20 °C
    min_heating_off_time: 60s
    min_heating_run_time: 60s
    min_idle_time: 30s
    heat_action:
      - switch.turn_on: heater_relay
    idle_action:
      - switch.turn_off: heater_relay

button:
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: template
    name: "Matter Factory Reset"
    entity_category: config
    disabled_by_default: True
    on_press:
      matter.factory_reset:
