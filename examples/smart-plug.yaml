# Hardware: any ESP32-C6 board (default esp32-c6-devkitc-1) with a relay on GPIO4, a status LED on GPIO5 and a
# button to GND on GPIO9.
# Demonstrates: a Matter on/off plug-in unit bound to a switch, a status LED that mirrors the relay and a button
# that factory resets the Matter commissioning data when held for 10 seconds. Uses Wi-Fi.

substitutions:
  name: matter-smart-plug
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  relay_pin: GPIO4
  led_pin: GPIO5
  button_pin: GPIO9

esphome:
  name: ${name}
  friendly_name: Matter Smart Plug

esp32:
  board: ${board}
  variant: ${variant}
  framework:
    type: esp-idf

external_components:
  - source: github://rjt-rockx/esphome-matter@main

logger:

api:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  endpoints:
    1:
      on_off_plug_in_unit:
        switch_id: relay

switch:
  # The relay is exposed through Matter. Matter restores the on/off state after a power cycle (see the
  # StartUpOnOff attribute), so the ESPHome restore mode should be ALWAYS_OFF.
  - platform: gpio
    id: relay
    name: Relay
    pin: ${relay_pin}
    restore_mode: ALWAYS_OFF
    # The status LED follows the relay.
    on_turn_on:
      - light.turn_on: status_led
    on_turn_off:
      - light.turn_off: status_led

output:
  - platform: gpio
    id: status_led_output
    pin: ${led_pin}

light:
  - platform: binary
    id: status_led
    name: Status LED
    output: status_led_output
    internal: true

binary_sensor:
  - platform: gpio
    id: reset_button
    name: Factory reset button
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      # Hold the button for 10 seconds to factory reset.
      min_length: 10s
      max_length: 60s
      then:
        - matter.factory_reset:
