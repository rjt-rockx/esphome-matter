esphome:
  name: matter-plug-spike

external_components:
  - source:
      type: git
      url: https://github.com/rjt-rockx/esphome-matter
      ref: main
    components: [matter]

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  framework:
    type: esp-idf
    version: 5.5.4

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

matter:
  vendor_id: 0xFFF2
  product_id: 0x8001
  discriminator: 3840
  passcode: 20202021
  on_commission:
    - logger.log:
        format: "matter commissioning event, joined=%d"
        args: [x]

switch:
  - platform: matter
    matter_id: matter1
    id: plug_switch
    name: "Desk Plug"
    type: on_off_plug_in_unit

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Factory Reset Button"
    on_multi_click:
      - timing:
          - ON for at least 5s
        then:
          - matter.factory_reset:
