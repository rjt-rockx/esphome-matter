esphome:
  name: all-sensor-devices

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6
  framework:
    type: esp-idf

logger:

api:

network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO6
  scl: GPIO7

uart:
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 9600

modbus:

external_components:
  - source: github://rjt-rockx/esphome-matter@main

# ESPHome sensors are "attached" to Matter device types that support them. Below is a collection of matter
# device types that can expose a sensor value to one or more of their cluster attributes.
#
# Matter uses fixed units. esphome-matter converts the value of a sensor from its unit_of_measurement, so always
# set the right unit_of_measurement (and device_class) on the sensors. A warning is logged when a sensor does not
# fit the attribute it is mapped to. See docs/sensors.md for all supported units.
matter:
  endpoints:
    1:
      # The temperature sensor is also supported by many other device types such as "temperature_controlled_cabinet"
      # or "cook_surface" but since these device types have no right to exist, these are not included in this list.
      temperature_sensor:
        temperature: temperature_id
    2:
      # The following schema is also supported for simple sensors that only expose a single sensor value.
      temperature_sensor: temperature_id
      # A battery level sensor (%) can be added to any endpoint. This creates a Power Source cluster with the
      # Battery feature on this endpoint.
      battery: battery_id
    3:
      humidity_sensor:
        relative_humidity: humidity_id
    4:
      # Matter reports hPa. Sensors in Pa, kPa, bar, mmHg, inHg or psi are converted.
      pressure_sensor:
        pressure: pressure_id
    5:
      flow_sensor:
        flow: flow_id
    6:
      light_sensor:
        illuminance: illuminance_id
    7:
      contact_sensor:
        boolean_state: bool_id
    8:
      water_leak_detector:
        boolean_state: bool_id
    9:
      water_freeze_detector:
        boolean_state: bool_id
    10:
      rain_sensor:
        boolean_state: bool_id
    11:
      air_quality_sensor:
        temperature: temperature_id
        relative_humidity: humidity_id
        carbon_monoxide: co_ppm
        carbon_dioxide: co2_ppm
        nitrogen_dioxide: no2_ppm
        ozone: o3_ppm
        formaldehyde: ch2o_ppm
        radon: radon_bq
        pm_1: pm_1_0
        pm_2_5: pm_2_5
        pm_10: pm_10_0
        total_voc: tvoc_ppb
        # The Matter MeasurementUnit is derived from the unit_of_measurement of each sensor. It only has to be set
        # to advertise a different unit than the sensor reports (the value is converted). Here the formaldehyde
        # sensor reports ppm, but the controller will show ppb.
        measurement_units:
          formaldehyde: ppb
    12:
      # A dedicated Power Source endpoint with a battery level sensor.
      power_source:
        battery: battery_id
    13:
      # Electrical measurements. Voltage, current, power, frequency and power factor are exposed through the
      # ElectricalPowerMeasurement cluster and the cumulative energy (kWh) through ElectricalEnergyMeasurement.
      # These clusters are created automatically for the sensors that are mapped.
      electrical_sensor:
        voltage: voltage_id
        active_current: current_id
        active_power: power_id
        frequency: frequency_id
        power_factor: power_factor_id
        energy_imported: energy_id
        # current_type: ac  # Default. Use "dc" for DC measurements (only voltage, active_current and active_power).

# Just an example of how to obtain sensor ids. The pressure, flow and illuminance sensors are placeholders.
sensor:
  - platform: scd30
    co2:
      id: co2_ppm
    temperature:
      id: temperature_id
    humidity:
      id: humidity_id
  - platform: sps30
    pm_1_0:
      id: pm_1_0
    pm_2_5:
      id: pm_2_5
    pm_10_0:
      id: pm_10_0
  - platform: pzemac
    voltage:
      id: voltage_id
    current:
      id: current_id
    power:
      id: power_id
    energy:
      id: energy_id
    frequency:
      id: frequency_id
    power_factor:
      id: power_factor_id
  - platform: template
    id: pressure_id
    unit_of_measurement: "kPa"
    device_class: pressure
    lambda: return 101.3;
  - platform: template
    id: flow_id
    unit_of_measurement: "m³/h"
    lambda: return 1.0;
  - platform: template
    id: illuminance_id
    unit_of_measurement: "lx"
    device_class: illuminance
    lambda: return 100.0;
  - platform: template
    id: co_ppm
    unit_of_measurement: "ppm"
    lambda: return 0.0;
  - platform: template
    id: no2_ppm
    unit_of_measurement: "ppm"
    lambda: return 0.0;
  - platform: template
    id: o3_ppm
    unit_of_measurement: "ppm"
    lambda: return 0.0;
  - platform: template
    id: ch2o_ppm
    unit_of_measurement: "ppm"
    lambda: return 0.0;
  - platform: template
    id: radon_bq
    unit_of_measurement: "Bq/m³"
    lambda: return 0.0;
  - platform: template
    id: tvoc_ppb
    unit_of_measurement: "ppb"
    lambda: return 0.0;
  - platform: adc
    pin: GPIO1
    id: battery_adc
    attenuation: 12db
  # A battery level in percent. Matter has no battery voltage so convert it with a template sensor.
  - platform: template
    id: battery_id
    unit_of_measurement: "%"
    device_class: battery
    lambda: |-
      return clamp((id(battery_adc).state - 3.3f) / (4.2f - 3.3f) * 100.0f, 0.0f, 100.0f);

switch:
  - platform: template
    id: debug_switch
    optimistic: true

binary_sensor:
  # Only binary_sensors can be attached to binary attributes so if you have a different boolean
  # ESPHome entity it must first be converted to binary_sensor.
  - platform: switch
    source_id: debug_switch
    id: bool_id
